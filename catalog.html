<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Каталог — Miata Garage</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
min-height:100vh;color:#f2f2f2;font-family:Arial,Helvetica,sans-serif;
background:
linear-gradient(rgba(5,5,6,.45),rgba(5,5,6,.58)),
linear-gradient(135deg,rgba(70,8,15,.28),rgba(5,5,5,.12) 45%,rgba(55,5,12,.22)),
repeating-linear-gradient(135deg,#191919 0,#191919 2px,#0c0c0c 2px,#0c0c0c 7px);
background-attachment:fixed
}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

header{
position:sticky;top:0;z-index:50;
background:linear-gradient(rgba(10,10,10,.88),rgba(35,5,9,.9));
border-bottom:1px solid rgba(255,70,80,.14);
backdrop-filter:blur(10px)
}
.header-inner{
max-width:1600px;margin:auto;min-height:74px;padding:10px 20px;
display:flex;align-items:center;gap:20px
}
.logo{display:flex;align-items:center;gap:10px;min-width:max-content;font-weight:800;font-size:20px}
.logo img{width:42px;height:42px;object-fit:contain}
.nav{display:flex;align-items:center;gap:7px;margin-left:auto}
.nav a{padding:10px 13px;border-radius:10px;color:#ddd;font-size:14px}
.nav a:hover,.nav a.active{background:rgba(145,18,30,.3);color:#fff}
.header-actions{display:flex;gap:8px;margin-left:5px}
.icon-btn{
width:42px;height:42px;border:1px solid rgba(255,255,255,.08);
border-radius:12px;background:rgba(255,255,255,.05);color:#fff
}

main{max-width:1600px;margin:auto;padding:35px 20px 100px}
.page-title{text-align:center;margin-bottom:28px}
.page-title h1{font-size:clamp(28px,4vw,48px);margin-bottom:8px}
.page-title p{color:#aaa;font-size:15px}

.controls{
display:flex;gap:10px;margin-bottom:25px;padding:12px;
background:linear-gradient(rgba(20,20,20,.72),rgba(45,7,12,.72));
border:1px solid rgba(255,255,255,.08);border-radius:15px
}
.search-box{flex:1}
.search-box input,.controls select{
width:100%;height:46px;padding:0 14px;
border:1px solid rgba(255,255,255,.09);border-radius:10px;
background:rgba(0,0,0,.4);color:#fff;outline:0
}
.controls select{max-width:220px}
.controls select option{background:#151515;color:#fff}

.catalog-grid{
display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px
}
.product-card{
min-width:0;overflow:hidden;
background:linear-gradient(145deg,rgba(30,30,30,.88),rgba(18,18,18,.92));
border:1px solid rgba(255,255,255,.08);border-radius:13px;
transition:.2s
}
.product-card:hover{
transform:translateY(-3px);border-color:rgba(200,30,45,.38);
box-shadow:0 12px 35px rgba(0,0,0,.35)
}
.product-image{position:relative;aspect-ratio:1/1;background:#222;overflow:hidden}
.product-image img{width:100%;height:100%;object-fit:cover;display:block}
.discount{
position:absolute;top:7px;left:7px;padding:4px 7px;border-radius:7px;
background:#9d1825;color:#fff;font-size:11px;font-weight:700
}
.out-of-stock{
position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
background:rgba(0,0,0,.58);color:#ddd;font-size:13px;font-weight:700
}
.product-info{padding:10px}
.product-name{font-size:14px;font-weight:700;line-height:1.25;min-height:35px;margin-bottom:5px}
.product-description{color:#999;font-size:11px;line-height:1.35;height:30px;overflow:hidden;margin-bottom:8px}
.prices{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.current-price{font-size:16px;font-weight:800}
.old-price{color:#777;font-size:11px;text-decoration:line-through}
.product-buttons{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.product-buttons button{
min-height:35px;border-radius:8px;border:1px solid rgba(255,255,255,.08);
color:#fff;background:rgba(255,255,255,.055);font-size:11px;font-weight:700
}
.product-buttons .cart-btn{background:#841723;border-color:#a01c2b}
.product-buttons button:disabled{opacity:.4;cursor:not-allowed}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:#999}
.empty-icon{font-size:40px;margin-bottom:10px}

.cart-button{
position:fixed;right:20px;bottom:20px;z-index:100;
width:62px;height:62px;border:1px solid rgba(255,255,255,.12);
border-radius:50%;background:linear-gradient(145deg,#9d1825,#5c0d15);
color:#fff;font-size:25px;box-shadow:0 8px 30px rgba(0,0,0,.5)
}
.cart-count{
position:absolute;right:-2px;top:-2px;min-width:22px;height:22px;padding:0 5px;
display:flex;align-items:center;justify-content:center;border-radius:20px;
background:#fff;color:#851722;font-size:11px;font-weight:800
}

.modal{
position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
padding:15px;background:linear-gradient(rgba(0,0,0,.72),rgba(28,4,8,.78));
backdrop-filter:blur(5px)
}
.modal.open{display:flex}
.modal-box{
width:min(700px,100%);max-height:90vh;overflow-y:auto;
background:linear-gradient(145deg,rgba(25,25,25,.97),rgba(39,7,11,.97));
border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:20px;
box-shadow:0 25px 80px rgba(0,0,0,.65)
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-head h2{font-size:21px}
.close-btn{
width:36px;height:36px;border:0;border-radius:9px;background:rgba(255,255,255,.07);
color:#fff;font-size:20px
}

.cart-items{display:flex;flex-direction:column;gap:10px}
.cart-item{
display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;
padding:8px;border-radius:10px;background:rgba(255,255,255,.04)
}
.cart-item img{
width:64px;height:64px;object-fit:cover;border-radius:8px;background:#222
}
.cart-item-name{font-size:13px;font-weight:700}
.cart-item-price{color:#bbb;font-size:12px;margin-top:4px}
.quantity{display:flex;align-items:center;gap:5px;margin-top:7px}
.quantity button{
width:25px;height:25px;border:1px solid rgba(255,255,255,.1);
border-radius:6px;background:rgba(255,255,255,.07);color:#fff
}
.quantity span{min-width:22px;text-align:center;font-size:12px}
.remove-btn{border:0;background:transparent;color:#d76a73;font-size:16px}
.cart-total{
display:flex;justify-content:space-between;padding-top:15px;margin-top:15px;
border-top:1px solid rgba(255,255,255,.09);font-size:18px;font-weight:800
}
.checkout-btn{
width:100%;min-height:46px;margin-top:15px;border:0;border-radius:10px;
background:#921b27;color:#fff;font-weight:800
}
.checkout-btn:disabled{opacity:.45;cursor:not-allowed}

.details-image{
width:100%;max-height:430px;object-fit:contain;background:#171717;
border-radius:12px;margin-bottom:15px
}
.details-description{color:#bbb;line-height:1.5;font-size:14px;margin-bottom:15px}

footer{
border-top:1px solid rgba(255,255,255,.07);padding:25px 20px;text-align:center;
color:#777;font-size:12px
}

@media(min-width:1400px){
.catalog-grid{grid-template-columns:repeat(8,minmax(0,1fr))}
}
@media(max-width:700px){
.header-inner{min-height:62px;padding:8px 10px;gap:8px}
.logo span{display:none}.logo img{width:38px;height:38px}
.nav{gap:2px}.nav a{padding:8px 7px;font-size:11px}
.header-actions{display:none}
main{padding:25px 7px 100px}
.page-title{margin-bottom:18px}.page-title h1{font-size:28px}.page-title p{font-size:12px}
.controls{padding:7px;gap:6px}.controls select{max-width:110px}
.search-box input,.controls select{height:38px;padding:0 8px;font-size:11px}
.catalog-grid{gap:5px}
.product-card{border-radius:8px}.product-info{padding:6px}
.product-name{font-size:10px;min-height:26px}
.product-description{font-size:8px;height:22px;margin-bottom:5px}
.current-price{font-size:11px}.old-price{font-size:8px}
.discount{top:4px;left:4px;font-size:8px;padding:3px 4px}
.product-buttons{grid-template-columns:1fr}
.product-buttons button{min-height:28px;font-size:8px;padding:2px}
.cart-button{right:12px;bottom:12px;width:55px;height:55px}
}
</style>
</head>

<body>

<header>
<div class="header-inner">
<a class="logo" href="index.html">
<img src="miata-garage.jpg" alt="Miata Garage">
<span>Miata Garage</span>
</a>

<nav class="nav">
<a href="index.html">Главная</a>
<a href="catalog.html" class="active">Каталог</a>
<a href="delivery.html">Доставка</a>
<a href="help.html">Помощь</a>
</nav>

<div class="header-actions">
<button class="icon-btn" onclick="openCart()">🛒</button>
</div>
</div>
</header>

<main>

<section class="page-title">
<h1>🛒 Каталог моделей</h1>
<p>Выберите модель и добавьте её в корзину</p>
</section>

<section class="controls">
<div class="search-box">
<input id="searchInput" type="search" placeholder="Поиск модели..." oninput="applyFilters()">
</div>

<select id="categoryFilter" onchange="applyFilters()">
<option value="">Все категории</option>
</select>
</section>

<section id="catalogGrid" class="catalog-grid">
<div class="empty">
<div class="empty-icon">⏳</div>
Загружаем каталог...
</div>
</section>

</main>

<footer>
© 2026 Miata Garage — магазин коллекционных моделей
</footer>

<button class="cart-button" onclick="openCart()">
🛒
<span id="cartCount" class="cart-count">0</span>
</button>

<!-- КОРЗИНА -->
<div id="cartModal" class="modal" onclick="backgroundClose(event,'cartModal')">
<div class="modal-box">

<div class="modal-head">
<h2>Ваш заказ</h2>
<button class="close-btn" onclick="closeModal('cartModal')">×</button>
</div>

<div id="cartItems" class="cart-items"></div>

<div class="cart-total">
<span>Итого:</span>
<span id="cartTotal">0 ₽</span>
</div>

<button id="checkoutButton" class="checkout-btn" onclick="goToCheckout()">
Перейти к оформлению доставки
</button>

</div>
</div>

<!-- ПОДРОБНОСТИ -->
<div id="detailsModal" class="modal" onclick="backgroundClose(event,'detailsModal')">
<div class="modal-box">

<div class="modal-head">
<h2 id="detailsTitle">Модель</h2>
<button class="close-btn" onclick="closeModal('detailsModal')">×</button>
</div>

<img id="detailsImage" class="details-image" src="" alt="">

<div id="detailsDescription" class="details-description"></div>

<div class="prices">
<span id="detailsPrice" class="current-price"></span>
<span id="detailsOldPrice" class="old-price"></span>
</div>

<button id="detailsCartButton" class="checkout-btn" onclick="addDetailsToCart()">
В корзину
</button>

</div>
</div>

<script>
/* ===============================
   НАСТРОЙКИ
================================ */

const SUPABASE_URL="https://qbuethosjrghgdwpanhb.supabase.co";
const SUPABASE_KEY="sb_publishable_l-Jn1GONymTw-fuN1eEgBw_FjtbUyzg";

/*
  ВАЖНО:
  Этот ключ должен совпадать с index.html.
*/
const CART_KEY="miata_garage_cart";

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let products=[];
let cart=loadCart();
let filteredProducts=[];
let detailsProduct=null;

/* ===============================
   TELEGRAM
================================ */

if(window.Telegram&&window.Telegram.WebApp){
Telegram.WebApp.ready();
Telegram.WebApp.expand();
}

/* ===============================
   CART STORAGE
================================ */

function loadCart(){
try{
const saved=localStorage.getItem(CART_KEY);
if(!saved)return[];

const data=JSON.parse(saved);
if(!Array.isArray(data))return[];

return data.map(x=>({
id:Number(x.id),
quantity:Math.max(1,Number(x.quantity||1))
})).filter(x=>Number.isFinite(x.id)&&x.id>0);

}catch(e){
console.error("Ошибка загрузки корзины",e);
return[];
}
}

function saveCart(){
localStorage.setItem(CART_KEY,JSON.stringify(cart));
}

/* ===============================
   START
================================ */

document.addEventListener("DOMContentLoaded",()=>{
updateCartCount();
loadProducts();
});

/* ===============================
   PRODUCTS
================================ */

async function loadProducts(){

const grid=document.getElementById("catalogGrid");

try{

const {data,error}=await db
.from("products")
.select("*")
.eq("is_active",true)
.order("id",{ascending:false});

if(error)throw error;

products=data||[];
filteredProducts=[...products];

normalizeCart();
fillCategories();
renderProducts();
updateCartCount();

}catch(error){

console.error(error);

grid.innerHTML=`
<div class="empty">
<div class="empty-icon">⚠️</div>
Не удалось загрузить каталог
</div>`;
}
}

/* ===============================
   CATEGORIES
================================ */

function fillCategories(){

const select=document.getElementById("categoryFilter");

const categories=[...new Set(
products.map(p=>p.category).filter(Boolean)
)].sort();

select.innerHTML='<option value="">Все категории</option>';

categories.forEach(category=>{
const option=document.createElement("option");
option.value=category;
option.textContent=category;
select.appendChild(option);
});
}

/* ===============================
   FILTERS
================================ */

function applyFilters(){

const search=document
.getElementById("searchInput")
.value
.trim()
.toLowerCase();

const category=document
.getElementById("categoryFilter")
.value;

filteredProducts=products.filter(p=>{

const text=[
p.name,
p.description,
p.category
].filter(Boolean).join(" ").toLowerCase();

return(
(!search||text.includes(search))&&
(!category||p.category===category)
);
});

renderProducts();
}

/* ===============================
   RENDER
================================ */

function renderProducts(){

const grid=document.getElementById("catalogGrid");

if(!filteredProducts.length){
grid.innerHTML=`
<div class="empty">
<div class="empty-icon">🔎</div>
По вашему запросу ничего не найдено
</div>`;
return;
}

grid.innerHTML=filteredProducts.map(product=>{

const image=product.image_url||"miata-logo.png";
const price=Number(product.price||0);
const oldPrice=Number(product.old_price||0);
const stock=Number(product.stock||0);
const discount=Number(product.discount||0);

return`
<article class="product-card">

<div class="product-image">

<img
src="${attr(image)}"
alt="${attr(product.name||"Модель")}"
loading="lazy"
onerror="this.src='miata-logo.png'"
>

${discount>0?`<span class="discount">-${discount}%</span>`:""}

${stock<=0?`<div class="out-of-stock">Нет в наличии</div>`:""}

</div>

<div class="product-info">

<div class="product-name">
${html(product.name||"Без названия")}
</div>

<div class="product-description">
${html(product.description||"Коллекционная модель")}
</div>

<div class="prices">

<span class="current-price">
${money(price)} ₽
</span>

${oldPrice>price?
`<span class="old-price">${money(oldPrice)} ₽</span>`:""}

</div>

<div class="product-buttons">

<button onclick="openDetails(${product.id})">
Подробнее
</button>

<button
class="cart-btn"
onclick="addToCart(${product.id})"
${stock<=0?"disabled":""}
>
${stock>0?"В корзину":"Нет в наличии"}
</button>

</div>

</div>
</article>
`;

}).join("");
}

/* ===============================
   DETAILS
================================ */

function openDetails(id){

const product=getProduct(id);
if(!product)return;

detailsProduct=product;

document.getElementById("detailsTitle").textContent=
product.name||"Модель";

document.getElementById("detailsImage").src=
product.image_url||"miata-logo.png";

document.getElementById("detailsDescription").textContent=
product.description||"Описание модели пока не добавлено.";

document.getElementById("detailsPrice").textContent=
money(product.price)+" ₽";

const old=document.getElementById("detailsOldPrice");
const oldPrice=Number(product.old_price||0);
const price=Number(product.price||0);

if(oldPrice>price){
old.textContent=money(oldPrice)+" ₽";
old.style.display="inline";
}else{
old.style.display="none";
}

const btn=document.getElementById("detailsCartButton");
const stock=Number(product.stock||0);

btn.disabled=stock<=0;
btn.textContent=stock>0?"В корзину":"Нет в наличии";

openModal("detailsModal");
}

function addDetailsToCart(){
if(!detailsProduct)return;
addToCart(detailsProduct.id);
closeModal("detailsModal");
}

/* ===============================
   ADD TO CART
================================ */

function addToCart(id){

const product=getProduct(id);

if(!product)return;

const stock=Number(product.stock||0);

if(stock<=0){
alert("Этого товара сейчас нет в наличии.");
return;
}

const existing=cart.find(
item=>Number(item.id)===Number(id)
);

if(existing){

if(Number(existing.quantity)>=stock){
alert("Больше этого товара нет в наличии.");
return;
}

existing.quantity++;

}else{

cart.push({
id:Number(id),
quantity:1
});

}

saveCart();
updateCartCount();

/*
  Небольшое визуальное подтверждение.
*/
const button=document.getElementById("cartCount");
button.animate(
[
{transform:"scale(1)"},
{transform:"scale(1.3)"},
{transform:"scale(1)"}
],
{duration:250}
);
}

/* ===============================
   CART
================================ */

function updateCartCount(){

const count=cart.reduce(
(sum,item)=>sum+Number(item.quantity||0),0
);

document.getElementById("cartCount").textContent=count;
}

function openCart(){

normalizeCart();
renderCart();
openModal("cartModal");
}

function renderCart(){

const container=document.getElementById("cartItems");
const checkout=document.getElementById("checkoutButton");

if(!cart.length){

container.innerHTML=`
<div class="empty">
<div class="empty-icon">🛒</div>
Корзина пока пустая
</div>`;

document.getElementById("cartTotal").textContent="0 ₽";
checkout.disabled=true;
return;
}

checkout.disabled=false;

let total=0;

container.innerHTML=cart.map(item=>{

const product=getProduct(item.id);

if(!product)return"";

const quantity=Number(item.quantity||1);
const price=Number(product.price||0);

total+=price*quantity;

return`
<div class="cart-item">

<img
src="${attr(product.image_url||"miata-logo.png")}"
alt=""
onerror="this.src='miata-logo.png'"
>

<div>

<div class="cart-item-name">
${html(product.name)}
</div>

<div class="cart-item-price">
${money(price)} ₽ × ${quantity}
</div>

<div class="quantity">

<button onclick="changeQuantity(${product.id},-1)">
−
</button>

<span>${quantity}</span>

<button onclick="changeQuantity(${product.id},1)">
+
</button>

</div>

</div>

<button
class="remove-btn"
onclick="removeFromCart(${product.id})"
>
🗑
</button>

</div>
`;

}).join("");

document.getElementById("cartTotal").textContent=
money(total)+" ₽";
}

/* ===============================
   QUANTITY
================================ */

function changeQuantity(id,change){

const item=cart.find(
x=>Number(x.id)===Number(id)
);

const product=getProduct(id);

if(!item||!product)return;

const stock=Number(product.stock||0);

let quantity=Number(item.quantity||1)+change;

if(quantity<=0){
removeFromCart(id);
return;
}

if(quantity>stock){
quantity=stock;
alert("Нельзя добавить больше товара, чем есть в наличии.");
}

item.quantity=quantity;

saveCart();
updateCartCount();
renderCart();
}

function removeFromCart(id){

cart=cart.filter(
item=>Number(item.id)!==Number(id)
);

saveCart();
updateCartCount();
renderCart();
}

/* ===============================
   NORMALIZE CART
================================ */

function normalizeCart(){

cart=cart.filter(item=>{

const product=getProduct(item.id);

if(!product)return false;

const stock=Number(product.stock||0);

if(stock<=0)return false;

item.quantity=Math.min(
Math.max(1,Number(item.quantity||1)),
stock
);

return true;
});

saveCart();
}

/* ===============================
   CHECKOUT
================================ */

/*
  ВАЖНО:
  index.html использует ту же корзину.
  Поэтому здесь мы НЕ создаём новую корзину
  и НЕ передаём товары через URL.

  Сохраняем корзину и отправляем пользователя
  на главную страницу.
*/

function goToCheckout(){

if(!cart.length){
alert("Сначала добавьте товары в корзину.");
return;
}

saveCart();

window.location.href="index.html#checkout";
}

/* ===============================
   MODALS
================================ */

function openModal(id){
document.getElementById(id).classList.add("open");
document.body.style.overflow="hidden";
}

function closeModal(id){
document.getElementById(id).classList.remove("open");
document.body.style.overflow="";
}

function backgroundClose(event,id){
if(event.target.id===id)closeModal(id);
}

/* ===============================
   HELPERS
================================ */

function getProduct(id){
return products.find(
p=>Number(p.id)===Number(id)
);
}

function money(value){
return Number(value||0).toLocaleString("ru-RU");
}

function html(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function attr(value){
return html(value);
}
</script>

</body>
</html>
