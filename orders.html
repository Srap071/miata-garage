/* =========================

========================= */

* {

}

html {

<script>

/* =========================
   CONFIG
========================= */

const SUPABASE_URL =
  "https://qbuethosjrghgdwpanhb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_l-Jn1GONymTw-fuN1eEgBw_FjtbUyzg";

const CUSTOMER_ORDERS_URL =
  SUPABASE_URL +
  "/functions/v1/customer-orders";


/*
  Менеджер.
  Одна кнопка:
  "Вопросы по заказу?"
  "Написать менеджеру"
*/

const MANAGER_URL =
  "https://t.me/lil_peepxx";


/* =========================
   DATA
========================= */

let orders = [];

let selectedOrderForCancel = null;


/* =========================
   TELEGRAM
========================= */

function initTelegram() {

  if (
    window.Telegram &&
    window.Telegram.WebApp
  ) {

    const tg =
      window.Telegram.WebApp;

    tg.ready();

    tg.expand();

  }

}


/* =========================
   TELEGRAM USER ID
========================= */

function getTelegramUserId() {

  return (
    window.Telegram?.WebApp
      ?.initDataUnsafe
      ?.user
      ?.id
    || null
  );

}


/* =========================
   HEADERS
========================= */

function apiHeaders() {

  return {

    "Content-Type":
      "application/json",

    "apikey":
      SUPABASE_PUBLISHABLE_KEY

  };

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
  .replaceAll("&", "&amp;")
  .replaceAll("<", "&lt;")
  .replaceAll(">", "&gt;")
  .replaceAll('"', "&quot;")
  .replaceAll("'", "&#039;");

}


/* =========================
   ESCAPE ATTRIBUTE
========================= */

function escapeAttribute(value) {

  return escapeHtml(value);

}


/* =========================
   PRICE
========================= */

function formatPrice(value) {

  const number =
    Number(value || 0);

  return number.toLocaleString(
    "ru-RU",
    {
      maximumFractionDigits: 2
    }
  );

}


/* =========================
   DATE
========================= */

function formatDate(value) {

  if (!value) {
    return "—";
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "—";
  }

  return date.toLocaleString(
    "ru-RU",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* =========================
   STATUS NORMALIZE
========================= */

function normalizeStatus(
  status
) {

  const raw =
    String(
      status || ""
    ).trim();

  const lower =
    raw.toLowerCase();

  if (
    lower === "processing" ||
    lower === "new" ||
    lower === "в обработке"
  ) {

    return {
      text: "В обработке",
      className: "status-processing",
      canCancel: true
    };

  }


  if (
    lower === "cancelled" ||
    lower === "canceled" ||
    lower === "отменён" ||
    lower === "отменен"
  ) {

    return {
      text: "Отменён",
      className: "status-cancelled",
      canCancel: false
    };

  }


  if (
    lower.includes("сборк") ||
    lower.includes("принят") ||
    lower === "assembly"
  ) {

    return {
      text: "Принят / В сборке",
      className: "status-assembly",
      canCancel: false
    };

  }


  if (
    lower.includes("достав") ||
    lower.includes("передан") ||
    lower === "delivery"
  ) {

    return {
      text: "Передан в доставку",
      className: "status-delivery",
      canCancel: false
    };

  }


  if (
    lower.includes("пункт") ||
    lower.includes("выдач") ||
    lower === "pickup"
  ) {

    return {
      text: "Заказ в пункте выдачи",
      className: "status-pickup",
      canCancel: false
    };

  }


  if (
    lower.includes("заверш") ||
    lower === "completed" ||
    lower === "done"
  ) {

    return {
      text: "Завершен",
      className: "status-completed",
      canCancel: false
    };

  }


  return {

    text:
      raw ||
      "В обработке",

    className:
      "status-processing",

    canCancel:
      true

  };

}


/* =========================
   ORDER NUMBER
========================= */

function getOrderNumber(order) {

  return (
    order.order_number ??
    order.Order_number ??
    order.id ??
    "—"
  );

}


/* =========================
   ORDER STATUS
========================= */

function getOrderStatus(order) {

  return (
    order.order_status ??
    order.status ??
    "В обработке"
  );

}


/* =========================
   ORDER ITEMS
========================= */

function getOrderItems(order) {

  if (
    Array.isArray(order.items)
  ) {

    return order.items;

  }

  if (
    typeof order.items === "string"
  ) {

    try {

      const parsed =
        JSON.parse(order.items);

      return Array.isArray(parsed)
        ? parsed
        : [];

    } catch {

      return [];

    }

  }

  return [];

}


/* =========================
   IMAGE FROM ITEM
========================= */

function getItemImage(item) {

  return (
    item?.image_url ||
    item?.image ||
    item?.photo_url ||
    item?.imageUrl ||
    "miata-logo.png"
  );

}


/* =========================
   PRODUCT LOOKUP
========================= */

async function enrichItemsWithImages(
  items
) {

  if (!items.length) {
    return items;
  }

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products" +
        "?select=id,name,image_url",
        {
          method: "GET",
          headers: {
            "apikey":
              SUPABASE_PUBLISHABLE_KEY
          }
        }
      );

    if (!response.ok) {
      return items;
    }

    const products =
      await response.json();

    if (!Array.isArray(products)) {
      return items;
    }


    return items.map(item => {

      const currentImage =
        getItemImage(item);

      if (
        currentImage &&
        currentImage !==
        "miata-logo.png"
      ) {

        return item;

      }


      const itemId =
        Number(
          item?.product_id ??
          item?.id ??
          0
        );


      let product =
        products.find(
          p =>
            Number(p.id) ===
            itemId
        );


      if (!product) {

        const itemName =
          String(
            item?.name || ""
          )
          .trim()
          .toLowerCase();

        if (itemName) {

          product =
            products.find(
              p =>
                String(
                  p.name || ""
                )
                .trim()
                .toLowerCase() ===
                itemName
            );

        }

      }


      if (
        product?.image_url
      ) {

        return {

          ...item,

          image_url:
            product.image_url

        };

      }

      return item;

    });

  } catch (error) {

    console.error(
      "Ошибка получения фото:",
      error
    );

    return items;

  }

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders() {

  const container =
    document.getElementById(
      "ordersContainer"
    );

  const telegramUserId =
    getTelegramUserId();


  if (!telegramUserId) {

    container.innerHTML = `

      <div class="message">

        Откройте магазин
        через Telegram,
        чтобы увидеть ваши заказы.

      </div>

    `;

    return;

  }


  container.innerHTML = `

    <div class="message">

      Загрузка заказов...

    </div>

  `;


  try {

    const response =
      await fetch(
        CUSTOMER_ORDERS_URL,
        {

          method: "POST",

          headers:
            apiHeaders(),

          body:
            JSON.stringify({

              action: "list",

              telegram_user_id:
                telegramUserId

            })

        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data?.success
    ) {

      throw new Error(
        data?.error ||
        "Не удалось загрузить заказы."
      );

    }


    orders =
      Array.isArray(data.orders)
        ? data.orders
        : [];


    /*
      Подтягиваем фото
      товаров для старых заказов,
      где image_url ещё не сохранён.
    */

    for (
      const order of orders
    ) {

      const items =
        getOrderItems(order);

      order.items =
        await enrichItemsWithImages(
          items
        );

    }


    renderOrders();

  } catch (error) {

    console.error(
      "Orders load error:",
      error
    );


    container.innerHTML = `

      <div class="message">

        Не удалось загрузить заказы.<br><br>

        ${escapeHtml(
          error?.message ||
          "Попробуйте открыть страницу ещё раз."
        )}

      </div>

    `;

  }

}


/* =========================
   RENDER ORDERS
========================= */

  const container =
    document.getElementById(
      "ordersContainer"
    );


  if (!orders.length) {

    container.innerHTML = `

      <div class="message">

  container.innerHTML =
    orders

/* =========================
   CANCEL
========================= */

function openCancelModal(
  index
) {

  const order =
    orders[index];

  if (!order) {
    return;
  }


  const status =
    normalizeStatus(
      getOrderStatus(order)
    );


  /*
    Отмена разрешена
    только для "В обработке".
  */

  if (
    !status.canCancel
  ) {

    openDetails(index);

    return;

  }


  selectedOrderForCancel =
    index;


  const reason =
    document.getElementById(
      "cancelReason"
    );


  if (reason) {
    reason.value = "";
  }


  openModal(
    "cancelModal"
  );

}


/* =========================
   CONFIRM CANCEL
========================= */

async function confirmCancel() {

  if (
    selectedOrderForCancel ===
    null
  ) {

    return;

  }


  const order =
    orders[
      selectedOrderForCancel
    ];


  if (!order) {
    return;
  }


  const telegramUserId =
    getTelegramUserId();


  if (!telegramUserId) {

    alert(
      "Не удалось определить Telegram ID."
    );

    return;

  }


  const reason =
    document
      .getElementById(
        "cancelReason"
      )
      ?.value
      ?.trim()
    || "";


  const buttons =
    document.querySelectorAll(
      "#cancelModal button"
    );


  buttons.forEach(
    button => {
      button.disabled = true;
    }
  );


  try {

    const response =
      await fetch(
        CUSTOMER_ORDERS_URL,
        {

          method: "POST",

          headers:
            apiHeaders(),

          body:
            JSON.stringify({

              action:
                "cancel",

              telegram_user_id:
                telegramUserId,

              order_id:
                order.id,

              cancel_reason:
                reason

            })

        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data?.success
    ) {

      throw new Error(
        data?.error ||
        "Не удалось отменить заказ."
      );

    }


    closeModal(
      "cancelModal"
    );


    selectedOrderForCancel =
      null;


    await loadOrders();


    alert(
      "Заказ отменён."
    );


  } catch (error) {

    console.error(
      "Cancel order error:",
      error
    );


    alert(
      error?.message ||
      "Не удалось отменить заказ."
    );


  } finally {

    buttons.forEach(
      button => {
        button.disabled = false;
      }
    );

  }

}


/* =========================
   MODALS
========================= */

function openModal(id) {

  const modal =
    document.getElementById(id);

  if (!modal) {
    return;
  }

  modal.classList.remove(
    "hidden"
  );

  document.body.style.overflow =
    "hidden";

}


function closeModal(id) {

  const modal =
    document.getElementById(id);

  if (!modal) {
    return;
  }

  modal.classList.add(
    "hidden"
  );

  document.body.style.overflow =
    "";

}


/* =========================
   CLOSE ON BACKDROP
========================= */

document
  .querySelectorAll(".modal")
  .forEach(
    modal => {

      modal.addEventListener(
        "click",
        event => {

          if (
            event.target ===
            modal
          ) {

            closeModal(
              modal.id
            );

          }

        }
      );

    }
  );
