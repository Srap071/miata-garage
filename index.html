<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="telegram-web-app-capable" content="yes">

<title>Miata Garage — коллекционные модели</title>

<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  color: #fff;
  background:
    linear-gradient(
      rgba(5,5,6,.55),
      rgba(5,5,6,.68)
    ),
    radial-gradient(
      circle at 80% 20%,
      rgba(110,0,15,.16),
      transparent 30%
    ),
    repeating-linear-gradient(
      135deg,
      #1a1a1a 0px,
      #1a1a1a 2px,
      #0c0c0c 2px,
      #0c0c0c 7px
    );
  background-attachment: fixed;
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.hidden {
  display: none !important;
}

a {
  color: inherit;
  text-decoration: none;
}

/* =========================
   HEADER
========================= */

header {
  position: sticky;
  top: 0;
  z-index: 50;
  height: 82px;
  border-bottom: 1px solid #292929;
  background: rgba(7,7,8,.96);
  backdrop-filter: blur(16px);
}

.header-inner {
  max-width: 1450px;
  height: 100%;
  margin: auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 18px;
}

.logo-small {
  font-size: 25px;
  font-weight: 950;
  letter-spacing: -1.3px;
  white-space: nowrap;
  line-height: 1;
  margin-right: auto;
}

.logo-small span {
  color: #e60019;
}

.logo-sub {
  display: block;
  margin-top: 4px;
  font-size: 8px;
  letter-spacing: 2px;
  color: #888;
  font-weight: 900;
}

.nav {
  display: flex;
  gap: 26px;
  color: #aaa;
  font-size: 13px;
  font-weight: bold;
}

.nav a:hover {
  color: #fff;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 9px;
}

.help-header {
  height: 40px;
  padding: 0 16px;
  border: 1px solid #3a3a3a;
  border-radius: 11px;
  background: #111113;
  color: #fff;
  font-size: 12px;
  font-weight: 900;
}

.help-header:hover {
  border-color: #e9001b;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border: 1px solid #333;
  border-radius: 50%;
  background: #101012;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
}

/* =========================
   HERO
========================= */

.hero {
  min-height: 570px;
  max-width: 1450px;
  margin: auto;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  border-bottom: 1px solid #292929;
  background:
    radial-gradient(
      circle at 75% 50%,
      rgba(170,0,20,.18),
      transparent 35%
    ),
    #070708;
}

.hero-image {
  position: absolute;
  right: 0;
  top: 0;
  width: 59%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  opacity: .78;

  mask-image: linear-gradient(
    to right,
    transparent 0%,
    black 28%
  );

  -webkit-mask-image: linear-gradient(
    to right,
    transparent 0%,
    black 28%
  );
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      90deg,
      #070708 0%,
      rgba(7,7,8,.95) 29%,
      rgba(7,7,8,.48) 60%,
      rgba(7,7,8,.05) 100%
    );
}

.hero-content {
  position: relative;
  z-index: 2;
  width: 58%;
  padding: 65px 55px;
}

.hero-kicker {
  color: #e9001b;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 2px;
}

.hero h1 {
  margin: 12px 0 18px;
  font-size: clamp(44px, 6vw, 78px);
  line-height: .92;
  text-transform: uppercase;
  letter-spacing: -3px;
}

.hero h1 span {
  color: #ed001b;
}

.hero-text {
  max-width: 620px;
  color: #aaa;
  font-size: 17px;
  line-height: 1.65;
}

.hero-info-card {
  margin-top: 26px;
  max-width: 650px;
  padding: 22px 24px;
  border: 1px solid #343438;
  border-radius: 15px;
  background:
    linear-gradient(
      rgba(20,20,22,.9),
      rgba(10,10,12,.94)
    ),
    repeating-linear-gradient(
      135deg,
      #252525 0px,
      #252525 2px,
      #151515 2px,
      #151515 7px
    );
  box-shadow: 0 15px 45px rgba(0,0,0,.28);
}

.hero-info-title {
  font-size: 17px;
  font-weight: 950;
  margin-bottom: 7px;
}

.hero-info-text {
  color: #999;
  font-size: 13px;
  line-height: 1.5;
}

.hero-buttons {
  display: flex;
  gap: 12px;
  margin-top: 25px;
}

.btn {
  border: 1px solid #444;
  border-radius: 10px;
  padding: 13px 22px;
  font-weight: 900;
  transition: .2s;
}

.btn-red {
  background: #ed001b;
  border-color: #ed001b;
  color: white;
  padding-left: 32px;
  padding-right: 32px;
}

.btn-dark {
  background: rgba(20,20,22,.85);
  color: white;
}

.btn:hover {
  transform: translateY(-2px);
}

/* =========================
   NEWS
========================= */

.news-slider {
  max-width: 1450px;
  margin: auto;
  padding: 35px 50px;
  position: relative;
  border-bottom: 1px solid #292929;
}

.news-track {
  display: flex;
  gap: 18px;
  overflow-x: auto;
  scroll-behavior: smooth;
  scrollbar-width: none;
}

.news-track::-webkit-scrollbar {
  display: none;
}

.news-card {
  flex: 0 0 100%;
  min-height: 246px;
  border: 1px solid #303030;
  border-radius: 17px;
  background:
    linear-gradient(
      rgba(20,20,22,.55),
      rgba(10,10,11,.88)
    ),
    repeating-linear-gradient(
      135deg,
      #343434 0px,
      #343434 2px,
      #242424 2px,
      #242424 7px
    );
  overflow: hidden;
  position: relative;
}

.news-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(
      circle at 85% 25%,
      rgba(230,0,25,.20),
      transparent 30%
    ),
    linear-gradient(
      to top,
      rgba(0,0,0,.75),
      transparent 70%
    );
}

.promo-card {
  display: flex;
  align-items: center;
  padding: 34px 42px;
}

.promo-content {
  position: relative;
  z-index: 3;
  max-width: 750px;
}

.promo-kicker {
  color: #ed001b;
  font-size: 12px;
  font-weight: 950;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.promo-title {
  font-size: clamp(25px, 4vw, 43px);
  line-height: 1;
  font-weight: 950;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.promo-text {
  color: #b1b1b1;
  font-size: 14px;
  line-height: 1.6;
  max-width: 600px;
}

.promo-code {
  display: inline-flex;
  align-items: center;
  margin-top: 20px;
  padding: 11px 18px;
  border: 1px solid #e9001b;
  border-radius: 10px;
  background: rgba(100,0,15,.25);
  color: white;
  font-size: 16px;
  font-weight: 950;
  letter-spacing: 1px;
}

.promo-code span {
  color: #ed001b;
  margin-left: 7px;
}

.slider-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 36px;
  height: 36px;
  border: 1px solid #444;
  border-radius: 50%;
  background: #090909;
  color: white;
  z-index: 5;
}

.slider-left {
  left: 8px;
}

.slider-right {
  right: 8px;
}

/* =========================
   SECTIONS
========================= */

.section {
  max-width: 1450px;
  margin: auto;
  padding: 65px 35px;
}

.section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 25px;
}

.section-title {
  margin: 0;
  font-size: 38px;
  text-transform: uppercase;
  letter-spacing: -1px;
}

.section-subtitle {
  color: #888;
  margin-top: 7px;
}

.section-link {
  color: #ed001b;
  font-size: 13px;
  font-weight: 900;
}

/* =========================
   PRODUCTS
========================= */

.products-grid {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 10px;
}

.product {
  min-width: 0;
  background:
    linear-gradient(
      rgba(17,17,19,.92),
      rgba(11,11,13,.96)
    );
  border: 1px solid #29292e;
  border-radius: 11px;
  overflow: hidden;
  transition: .2s;
}

.product:hover {
  transform: translateY(-3px);
  border-color: #e00019;
}

.product-image-wrap {
  position: relative;
  background: #1a1a1c;
}

.product img {
  display: block;
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
}

.discount {
  position: absolute;
  top: 6px;
  left: 6px;
  background: #e9001b;
  color: white;
  padding: 4px 5px;
  border-radius: 5px;
  font-size: 9px;
  font-weight: 900;
}

.product-info {
  padding: 9px;
}

.product-name {
  font-size: 12px;
  line-height: 1.2;
  font-weight: 900;
  min-height: 29px;
}

.product-description {
  color: #777;
  font-size: 9px;
  line-height: 1.3;
  margin-top: 5px;
  min-height: 24px;
}

.price {
  margin-top: 7px;
  font-size: 14px;
  font-weight: 900;
}

.old-price {
  color: #666;
  text-decoration: line-through;
  font-size: 10px;
  margin-right: 4px;
}

.product-buttons {
  display: grid;
  grid-template-columns: 1fr;
  gap: 5px;
  margin-top: 8px;
}

.product-btn {
  width: 100%;
  border-radius: 7px;
  padding: 7px 4px;
  border: 1px solid #36363b;
  background: #1c1c20;
  color: white;
  font-size: 9px;
  font-weight: 900;
}

.product-btn.cart-add {
  background: #e9001b;
  border-color: #e9001b;
}

/* =========================
   BENEFITS
========================= */

.benefits-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.benefit {
  border: 1px solid #29292e;
  border-radius: 12px;
  padding: 20px 15px;
  background:
    linear-gradient(
      rgba(15,15,17,.86),
      rgba(9,9,11,.92)
    );
}

.benefit-icon {
  font-size: 25px;
  margin-bottom: 10px;
}

.benefit-title {
  font-size: 13px;
  font-weight: 900;
}

.benefit-text {
  color: #777;
  font-size: 11px;
  line-height: 1.4;
  margin-top: 5px;
}

/* =========================
   FOOTER
========================= */

footer {
  border-top: 1px solid #292929;
  background: rgba(8,8,9,.94);
}

.footer-inner {
  max-width: 1450px;
  margin: auto;
  padding: 45px 35px 90px;
  display: grid;
  grid-template-columns: 2fr 1fr 1.5fr;
  gap: 40px;
}

.footer-logo {
  font-size: 28px;
  font-weight: 900;
}

.footer-logo span {
  color: #ed001b;
}

.footer-description {
  color: #777;
  max-width: 350px;
  line-height: 1.6;
}

.footer h3 {
  font-size: 14px;
  margin-top: 0;
}

.footer a {
  display: block;
  color: #888;
  margin: 9px 0;
  font-size: 14px;
}

.footer a:hover {
  color: white;
}

.telegram-button {
  display: flex !important;
  align-items: center;
  gap: 8px;
  width: fit-content;
  border: 1px solid #333;
  border-radius: 9px;
  padding: 9px 12px;
  background: #121214;
  color: #ddd !important;
}

.telegram-button:hover {
  border-color: #e9001b;
}

.copyright {
  max-width: 1450px;
  margin: auto;
  padding: 15px 35px;
  border-top: 1px solid #242424;
  color: #555;
  font-size: 12px;
}

/* =========================
   CART FLOATING
========================= */

.cart-floating {
  position: fixed;
  right: 22px;
  bottom: 22px;
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: #ed001b;
  color: white;
  border: 3px solid #080808;
  box-shadow: 0 8px 30px rgba(0,0,0,.55);
  z-index: 80;
  font-size: 23px;
}

.cart-count {
  position: absolute;
  right: -3px;
  top: -3px;
  min-width: 21px;
  height: 21px;
  padding: 3px;
  border-radius: 50%;
  background: white;
  color: #111;
  font-size: 11px;
  font-weight: 900;
}

/* =========================
   MODALS
========================= */

.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.8);
  backdrop-filter: blur(8px);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
}

.modal-box {
  width: 100%;
  max-width: 700px;
  max-height: 92vh;
  overflow-y: auto;
  border: 1px solid #3a3a3e;
  border-radius: 18px;
  background:
    linear-gradient(
      rgba(10,10,11,.55),
      rgba(10,10,11,.68)
    ),
    radial-gradient(
      circle at 80% 10%,
      rgba(100,0,15,.15),
      transparent 35%
    ),
    repeating-linear-gradient(
      135deg,
      #222 0px,
      #222 2px,
      #111 2px,
      #111 7px
    );
  padding: 24px;
  box-shadow: 0 20px 70px rgba(0,0,0,.65);
}

.modal-title {
  font-size: 25px;
  font-weight: 900;
  margin-bottom: 20px;
}

.close {
  float: right;
  border: 1px solid #333;
  background: #18181b;
  color: white;
  border-radius: 50%;
  width: 35px;
  height: 35px;
}

.cart-item {
  display: grid;
  grid-template-columns: 70px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid #292929;
}

.cart-item img {
  width: 70px;
  height: 70px;
  border-radius: 9px;
  object-fit: cover;
}

.cart-item-name {
  font-weight: 900;
  font-size: 14px;
}

.cart-item-price {
  color: #aaa;
  margin-top: 5px;
  font-size: 13px;
}

.quantity {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 8px;
}

.quantity button {
  width: 28px;
  height: 28px;
  padding: 0;
  border-radius: 7px;
  background: #29292e;
  color: white;
  border: 0;
}

.remove {
  border: 0;
  background: transparent;
  color: #e9001b;
  font-size: 18px;
}

.cart-total {
  display: flex;
  justify-content: space-between;
  padding: 20px 0;
  font-size: 21px;
  font-weight: 900;
}

.full-btn {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 0;
  background: #ed001b;
  color: white;
  font-weight: 900;
}

.form-group {
  margin-bottom: 13px;
}

.form-group label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 6px;
}

.form-control {
  width: 100%;
  border: 1px solid #34343a;
  background: rgba(8,8,10,.88);
  color: white;
  padding: 13px;
  border-radius: 9px;
  outline: none;
}

.form-control:focus {
  border-color: #e9001b;
}

.delivery-options {
  display: grid;
  gap: 8px;
}

.delivery-option {
  border: 1px solid #333;
  background: rgba(12,12,15,.9);
  color: white;
  padding: 13px;
  border-radius: 9px;
  text-align: left;
}

.delivery-option.active {
  border-color: #e9001b;
  background: #211014;
}

.delivery-price {
  color: #aaa;
  font-size: 12px;
  margin-top: 4px;
}

.checkout-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid #292929;
}

.checkout-item img {
  width: 48px;
  height: 48px;
  object-fit: cover;
  border-radius: 7px;
}

.checkout-quantity {
  color: #aaa;
  font-size: 12px;
  margin-top: 3px;
}

.checkout-note {
  color: #777;
  font-size: 11px;
  margin: 10px 0 20px;
}

.success {
  text-align: center;
  padding: 35px 10px;
}

.success-icon {
  font-size: 55px;
}

.success h2 {
  margin: 10px 0;
}

.order-number {
  margin: 20px 0;
  padding: 16px;
  border: 1px solid #3a2529;
  border-radius: 12px;
  background: rgba(90,0,15,.16);
  font-size: 20px;
  font-weight: 900;
}

.order-number span {
  color: #ed001b;
}

.details-image {
  width: 100%;
  max-height: 430px;
  object-fit: contain;
  border-radius: 12px;
  background: #171719;
}

.details-price {
  font-size: 27px;
  font-weight: 900;
  margin: 18px 0;
}

.details-description {
  color: #aaa;
  line-height: 1.7;
}

/* =========================
   MOBILE NAV
========================= */

.mobile-nav {
  display: none;
