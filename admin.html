<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Миата Гараж — Админка</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d0d0f;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 25px;
    }

    .card {
      background: #17171b;
      border: 1px solid #29292f;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      margin-bottom: 13px;
      background: #0f0f12;
      color: white;
      border: 1px solid #33333a;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    label {
      color: #bbb;
      font-size: 14px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: bold;
      margin: 4px;
    }

    .primary {
      background: white;
      color: black;
    }

    .secondary {
      background: #29292f;
      color: white;
    }

    .danger {
      background: #9f2424;
      color: white;
    }

    .product {
      display: flex;
      gap: 15px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #29292f;
    }

    .product:last-child {
      border-bottom: 0;
    }

    .product img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 12px;
      background: #222;
    }

    .product-info {
      flex: 1;
    }

    .product-name {
      font-weight: bold;
      font-size: 17px;
    }

    .product-meta {
      color: #999;
      font-size: 13px;
      margin-top: 5px;
    }

    .hidden {
      opacity: .45;
    }

    #loginScreen {
      max-width: 450px;
      margin: 80px auto;
      padding: 20px;
    }

    #adminScreen {
      display: none;
    }

    #message {
      margin: 10px 0;
      color: #aaa;
    }

    #preview {
      display: none;
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      margin: 10px 0;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .product {
        align-items: flex-start;
      }

      .product img {
        width: 65px;
        height: 65px;
      }

      .product-actions {
        display: flex;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div id="loginScreen">
  <div class="card">
    <h1>Миата Гараж</h1>
    <div class="subtitle">Панель администратора</div>

    <label>Email</label>
    <input id="email" type="email" placeholder="Введите email">

    <label>Пароль</label>
    <input id="password" type="password" placeholder="Введите пароль">

    <button class="primary" onclick="login()">Войти</button>

    <div id="loginMessage"></div>
  </div>
</div>


<div id="adminScreen">
  <div class="container">

    <div class="topbar">
      <div>
        <h1>Миата Гараж</h1>
        <div class="subtitle">Управление магазином</div>
      </div>

      <button class="secondary" onclick="logout()">Выйти</button>
    </div>


    <div class="card">

      <h2 id="formTitle">Добавить товар</h2>

      <input type="hidden" id="productId">

      <label>Название товара</label>
      <input id="name" placeholder="Например: Фары для Miata">

      <label>Описание</label>
      <textarea id="description" placeholder="Описание товара"></textarea>

      <label>Цена</label>
      <input id="price" type="number" step="0.01" placeholder="5000">

      <label>Категория</label>
      <input id="category" placeholder="Например: Оптика">

      <label>Остаток</label>
      <input id="stock" type="number" placeholder="10">

      <label>Фотография</label>
      <input id="imageFile" type="file" accept="image/*" onchange="previewImage()">

      <img id="preview">

      <button class="primary" onclick="saveProduct()">
        Сохранить товар
      </button>

      <button
        id="cancelButton"
        class="secondary"
        onclick="cancelEdit()"
        style="display:none;"
      >
        Отмена
      </button>

      <div id="message"></div>

    </div>


    <div class="card">

      <h2>Товары</h2>

      <div id="products">
        Загрузка...
      </div>

    </div>

  </div>
</div>


<script>

const SUPABASE_URL = "https://qbuethosjrghgdwpanhb.supabase.co";
const SUPABASE_KEY = "sb_publishable_l-Jn1GONymTw-fuN1eEgBw_FjtbUyzg";

const BUCKET = "product-images";

let accessToken = localStorage.getItem("miata_access_token");


function headers(json = false) {

  const h = {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + accessToken
  };

  if (json) {
    h["Content-Type"] = "application/json";
  }

  return h;
}


async function login() {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const response = await fetch(
    SUPABASE_URL + "/auth/v1/token?grant_type=password",
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email,
        password
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {

    document.getElementById("loginMessage").textContent =
      data.message || "Ошибка входа";

    return;
  }

  accessToken = data.access_token;

  localStorage.setItem(
    "miata_access_token",
    accessToken
  );

  showAdmin();

}


function showAdmin() {

  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("adminScreen").style.display = "block";

  loadProducts();

}


function logout() {

  localStorage.removeItem("miata_access_token");

  accessToken = null;

  location.reload();

}


function previewImage() {

  const file =
    document.getElementById("imageFile").files[0];

  const preview =
    document.getElementById("preview");

  if (!file) {

    preview.style.display = "none";

    return;
  }

  preview.src = URL.createObjectURL(file);

  preview.style.display = "block";

}


async function uploadImage(file) {

  if (!file) return null;

  const extension =
    file.name.split(".").pop().toLowerCase();

  const fileName =
    Date.now() +
    "-" +
    Math.random().toString(36).substring(2) +
    "." +
    extension;

  const path =
    "products/" + fileName;


  const response = await fetch(
    SUPABASE_URL +
    "/storage/v1/object/" +
    BUCKET +
    "/" +
    path,
    {
      method: "POST",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + accessToken,
        "Content-Type": file.type
      },

      body: file
    }
  );


  if (!response.ok) {

    const error =
      await response.text();

    throw new Error(
      "Ошибка загрузки фото: " + error
    );

  }


  return (
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    BUCKET +
    "/" +
    path
  );

}


async function saveProduct() {

  const id =
    document.getElementById("productId").value;

  const name =
    document.getElementById("name").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const price =
    Number(document.getElementById("price").value);

  const category =
    document.getElementById("category").value.trim();

  const stock =
    Number(document.getElementById("stock").value);

  const file =
    document.getElementById("imageFile").files[0];


  if (!name) {

    alert("Введите название товара");

    return;
  }


  try {

    document.getElementById("message").textContent =
      "Сохраняем...";


    let imageUrl = null;


    if (file) {

      imageUrl =
        await uploadImage(file);

    }


    const product = {

      name,
      description,
      price,
      category,
      stock,
      is_active: true

    };


    if (imageUrl) {

      product.image_url = imageUrl;

    }


    let response;


    if (id) {

      response = await fetch(

        SUPABASE_URL +
        "/rest/v1/products?id=eq." +
        id,

        {
          method: "PATCH",

          headers: headers(true),

          body: JSON.stringify(product)

        }

      );

    } else {

      response = await fetch(

        SUPABASE_URL +
        "/rest/v1/products",

        {
          method: "POST",

          headers: {
            ...headers(true),
            "Prefer": "return=representation"
          },

          body: JSON.stringify(product)

        }

      );

    }


    if (!response.ok) {

      const error =
        await response.text();

      throw new Error(error);

    }


    document.getElementById("message").textContent =
      id
      ? "Товар обновлён ✅"
      : "Товар добавлен ✅";


    clearForm();

    loadProducts();


  } catch (error) {

    console.error(error);

    document.getElementById("message").textContent =
      "Ошибка: " + error.message;

  }

}


async function loadProducts() {

  const response = await fetch(

    SUPABASE_URL +
    "/rest/v1/products?select=*&order=id.desc",

    {
      headers: headers()
    }

  );


  if (!response.ok) {

    document.getElementById("products").textContent =
      "Ошибка загрузки товаров";

    return;

  }


  const products =
    await response.json();


  const container =
    document.getElementById("products");


  if (!products.length) {

    container.textContent =
      "Товаров пока нет";

    return;

  }


  container.innerHTML = products.map(product => `

    <div class="product ${product.is_active ? "" : "hidden"}">

      ${
        product.image_url
        ? `<img src="${product.image_url}">`
        : `<img src="https://via.placeholder.com/80?text=NO+PHOTO">`
      }

      <div class="product-info">

        <div class="product-name">
          ${escapeHtml(product.name)}
        </div>

        <div class="product-meta">

          ${product.price} ₽ ·
          Остаток: ${product.stock}

          ${
            product.category
            ? " · " + escapeHtml(product.category)
            : ""
          }

          ${
            product.is_active
            ? ""
            : " · СКРЫТ"
          }

        </div>

      </div>

      <div class="product-actions">

        <button
          class="secondary"
          onclick="editProduct(${product.id})"
        >
          ✏️
        </button>

        <button
          class="secondary"
          onclick="toggleProduct(${product.id}, ${product.is_active})"
        >
          ${product.is_active ? "👁️" : "👁️‍🗨️"}
        </button>

        <button
          class="danger"
          onclick="deleteProduct(${product.id})"
        >
          🗑️
        </button>

      </div>

    </div>

  `).join("");

}


async function editProduct(id) {

  const response = await fetch(

    SUPABASE_URL +
    "/rest/v1/products?id=eq." +
    id +
    "&select=*",

    {
      headers: headers()
    }

  );


  const data =
    await response.json();

  if (!data.length) {

    alert("Товар не найден");

    return;

  }


  const product =
    data[0];


  document.getElementById("productId").value =
    product.id;

  document.getElementById("name").value =
    product.name || "";

  document.getElementById("description").value =
    product.description || "";

  document.getElementById("price").value =
    product.price || "";

  document.getElementById("category").value =
    product.category || "";

  document.getElementById("stock").value =
    product.stock || 0;


  document.getElementById("formTitle").textContent =
    "Редактировать товар";

  document.getElementById("cancelButton").style.display =
    "inline-block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


async function toggleProduct(id, currentState) {

  const response = await fetch(

    SUPABASE_URL +
    "/rest/v1/products?id=eq." +
    id,

    {
      method: "PATCH",

      headers: headers(true),

      body: JSON.stringify({
        is_active: !currentState
      })

    }

  );


  if (!response.ok) {

    alert("Не удалось изменить статус");

    return;

  }


  loadProducts();

}


async function deleteProduct(id) {

  const ok =
    confirm("Удалить этот товар?");

  if (!ok) return;


  const response = await fetch(

    SUPABASE_URL +
    "/rest/v1/products?id=eq." +
    id,

    {
      method: "DELETE",

      headers: headers()
    }

  );


  if (!response.ok) {

    alert(
      "Не удалось удалить товар"
    );

    return;

  }


  loadProducts();

}


function clearForm() {

  document.getElementById("productId").value = "";

  document.getElementById("name").value = "";

  document.getElementById("description").value = "";

  document.getElementById("price").value = "";

  document.getElementById("category").value = "";

  document.getElementById("stock").value = "";

  document.getElementById("imageFile").value = "";

  document.getElementById("preview").style.display =
    "none";

  document.getElementById("formTitle").textContent =
    "Добавить товар";

  document.getElementById("cancelButton").style.display =
    "none";

}


function cancelEdit() {

  clearForm();

}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


if (accessToken) {

  showAdmin();

}

</script>

</body>
</html>
