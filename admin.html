<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Miata Garage — Admin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #09090b;
  color: #fff;
  font-family: Arial, sans-serif;
}

button,
input,
textarea,
select {
  font: inherit;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 16px;
}

h1 {
  margin: 0 0 18px;
}

h2 {
  margin-top: 0;
}

.card {
  background: #151518;
  border: 1px solid #29292e;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
}

.hidden {
  display: none !important;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  margin: 6px 0 12px;
  background: #0d0d10;
  color: white;
  border: 1px solid #34343b;
  border-radius: 10px;
}

textarea {
  min-height: 100px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px 14px;
  cursor: pointer;
  font-weight: bold;
}

.primary {
  background: white;
  color: black;
}

.secondary {
  background: #29292f;
  color: white;
}

.danger {
  background: #b3261e;
  color: white;
}

.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin-bottom: 16px;
}

.tab {
  white-space: nowrap;
  background: #19191d;
  color: #aaa;
}

.tab.active {
  background: white;
  color: black;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 720px;
}

th,
td {
  padding: 11px 8px;
  border-bottom: 1px solid #29292e;
  text-align: left;
  vertical-align: middle;
}

th {
  color: #999;
  font-size: 13px;
}

.product-img {
  width: 55px;
  height: 55px;
  border-radius: 9px;
  object-fit: cover;
  background: #222;
}

.actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.status {
  display: inline-block;
  padding: 5px 8px;
  border-radius: 8px;
  background: #24242a;
  font-size: 13px;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 10;
}

.modal-box {
  width: 100%;
  max-width: 550px;
  max-height: 90vh;
  overflow-y: auto;
  background: #151518;
  border: 1px solid #303038;
  border-radius: 18px;
  padding: 18px;
}

.close {
  float: right;
  background: #29292f;
  color: white;
}

.order-row {
  cursor: pointer;
}

.order-row:hover {
  background: #1c1c21;
}

.total {
  font-size: 20px;
  font-weight: bold;
}

.message {
  padding: 10px;
  border-radius: 10px;
  background: #202025;
  margin-bottom: 12px;
}

@media (max-width: 600px) {
  .container {
    padding: 10px;
  }

  .toolbar {
    align-items: stretch;
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->

  <div id="loginScreen" class="card">

    <h1>🚗 Miata Garage</h1>

    <p>Панель администратора</p>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Пароль"
    >

    <button class="primary" onclick="login()">
      Войти
    </button>

    <div id="loginMessage" class="message hidden"></div>

  </div>


  <!-- ADMIN -->

  <div id="adminScreen" class="hidden">

    <h1>Miata Garage</h1>

    <div class="tabs">

      <button
        id="productsTab"
        class="tab active"
        onclick="showTab('products')"
      >
        📦 Товары
      </button>

      <button
        id="ordersTab"
        class="tab"
        onclick="showTab('orders')"
      >
        🛒 Заказы
      </button>

    </div>


    <!-- PRODUCTS -->

    <section id="productsSection">

      <div class="toolbar">

        <h2>Товары</h2>

        <button
          class="primary"
          onclick="openProductModal()"
        >
          ＋ Добавить
        </button>

      </div>

      <div
        id="productsMessage"
        class="message hidden"
      ></div>

      <div class="card">

        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>Фото</th>
                <th>Название</th>
                <th>Цена</th>
                <th>Категория</th>
                <th>Остаток</th>
                <th>Статус</th>
                <th>Действия</th>
              </tr>
            </thead>

            <tbody id="productsTable"></tbody>

          </table>

        </div>

      </div>

    </section>


    <!-- ORDERS -->

    <section
      id="ordersSection"
      class="hidden"
    >

      <h2>Заказы</h2>

      <div class="tabs">

        <button
          class="tab active"
          id="ordersNewTab"
          onclick="setOrderFilter('new')"
        >
          🆕 Активные
        </button>

        <button
          class="tab"
          id="ordersDeliveryTab"
          onclick="setOrderFilter('delivery')"
        >
          🚚 В доставке
        </button>

        <button
          class="tab"
          id="ordersDoneTab"
          onclick="setOrderFilter('done')"
        >
          ✅ Прошедшие
        </button>

      </div>

      <div class="card">

        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>№</th>
                <th>Клиент</th>
                <th>Сумма</th>
                <th>Дата</th>
                <th>Статус</th>
              </tr>
            </thead>

            <tbody id="ordersTable"></tbody>

          </table>

        </div>

      </div>

    </section>

  </div>

</div>


<!-- PRODUCT MODAL -->

<div
  id="productModal"
  class="modal hidden"
>

  <div class="modal-box">

    <button
      class="close"
      onclick="closeProductModal()"
    >
      ✕
    </button>

    <h2 id="productModalTitle">
      Добавить товар
    </h2>

    <input
      id="productName"
      placeholder="Название"
    >

    <textarea
      id="productDescription"
      placeholder="Описание"
    ></textarea>

    <input
      id="productPrice"
      type="number"
      step="0.01"
      placeholder="Цена"
    >

    <input
      id="productCategory"
      placeholder="Категория"
    >

    <input
      id="productStock"
      type="number"
      placeholder="Остаток"
      value="0"
    >

    <label>
      📷 Фотография
    </label>

    <input
      id="productImage"
      type="file"
      accept="image/*"
    >

    <p id="selectedFile">
      Фото не выбрано
    </p>

    <button
      class="primary"
      onclick="saveProduct()"
    >
      💾 Сохранить
    </button>

    <div
      id="productModalMessage"
      class="message hidden"
    ></div>

  </div>

</div>


<!-- ORDER MODAL -->

<div
  id="orderModal"
  class="modal hidden"
>

  <div class="modal-box">

    <button
      class="close"
      onclick="closeOrderModal()"
    >
      ✕
    </button>

    <h2>🛒 Заказ</h2>

    <div id="orderDetails"></div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://qbuethosjrghgdwpanhb.supabase.co";

/*
  ВСТАВЬ СЮДА СВОЙ НОВЫЙ
  PUBLISHABLE KEY
*/

const SUPABASE_KEY =
  "sb_publishable_l-Jn1GONymTw-fuN1eEgBw_FjtbUyzg";

const BUCKET =
  "product-images";

let accessToken = "";

let editingProductId = null;

let currentOrderFilter = "new";


/* =========================
   HEADERS
========================= */

function headers() {

  return {
    "apikey": SUPABASE_KEY,
    "Authorization":
      "Bearer " + accessToken,
    "Content-Type":
      "application/json"
  };

}


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {

    showMessage(
      "loginMessage",
      "Введите email и пароль"
    );

    return;

  }

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error_description ||
        data.message ||
        "Ошибка входа"
      );

    }

    accessToken =
      data.access_token;

    document
      .getElementById("loginScreen")
      .classList.add("hidden");

    document
      .getElementById("adminScreen")
      .classList.remove("hidden");

    loadProducts();

  } catch (error) {

    showMessage(
      "loginMessage",
      "❌ " + error.message
    );

  }

}


/* =========================
   TABS
========================= */

function showTab(tab) {

  document
    .getElementById("productsSection")
    .classList.toggle(
      "hidden",
      tab !== "products"
    );

  document
    .getElementById("ordersSection")
    .classList.toggle(
      "hidden",
      tab !== "orders"
    );

  document
    .getElementById("productsTab")
    .classList.toggle(
      "active",
      tab === "products"
    );

  document
    .getElementById("ordersTab")
    .classList.toggle(
      "active",
      tab === "orders"
    );

  if (tab === "orders") {

    loadOrders();

  }

}


/* =========================
   PRODUCTS
========================= */

async function loadProducts() {

  const table =
    document.getElementById(
      "productsTable"
    );

  table.innerHTML =
    "<tr><td colspan='7'>Загрузка...</td></tr>";

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?select=*&order=id.desc",
        {
          headers: headers()
        }
      );

    const products =
      await response.json();

    if (!response.ok) {

      throw new Error(
        JSON.stringify(products)
      );

    }

    if (!products.length) {

      table.innerHTML =
        "<tr><td colspan='7'>Товаров пока нет.</td></tr>";

      return;

    }

    table.innerHTML =
      products.map(product => {

        const image =
          product.image_url || "";

        return `
          <tr>

            <td>
              ${
                image
                ? `<img
                    class="product-img"
                    src="${escapeHtml(image)}"
                  >`
                : "—"
              }
            </td>

            <td>
              <b>
                ${escapeHtml(product.name)}
              </b>
            </td>

            <td>
              ${Number(product.price).toFixed(2)} €
            </td>

            <td>
              ${escapeHtml(product.category || "—")}
            </td>

            <td>
              ${product.stock}
            </td>

            <td>
              <span class="status">
                ${
                  product.is_active
                  ? "🟢 Активен"
                  : "🔴 Скрыт"
                }
              </span>
            </td>

            <td>

              <div class="actions">

                <button
                  class="secondary"
                  onclick="editProduct(${product.id})"
                >
                  ✏️
                </button>

                <button
                  class="secondary"
                  onclick="toggleProduct(
                    ${product.id},
                    ${product.is_active}
                  )"
                >
                  ${
                    product.is_active
                    ? "Скрыть"
                    : "Показать"
                  }
                </button>

                <button
                  class="danger"
                  onclick="deleteProduct(${product.id})"
                >
                  🗑
                </button>

              </div>

            </td>

          </tr>
        `;

      }).join("");

  } catch (error) {

    table.innerHTML =
      `<tr>
        <td colspan="7">
          ❌ ${escapeHtml(error.message)}
        </td>
      </tr>`;

  }

}


/* =========================
   PRODUCT MODAL
========================= */

function openProductModal() {

  editingProductId = null;

  document
    .getElementById("productModalTitle")
    .textContent =
      "Добавить товар";

  clearProductForm();

  document
    .getElementById("productModal")
    .classList.remove("hidden");

}


function closeProductModal() {

  document
    .getElementById("productModal")
    .classList.add("hidden");

}


function clearProductForm() {

  document.getElementById(
    "productName"
  ).value = "";

  document.getElementById(
    "productDescription"
  ).value = "";

  document.getElementById(
    "productPrice"
  ).value = "";

  document.getElementById(
    "productCategory"
  ).value = "";

  document.getElementById(
    "productStock"
  ).value = "0";

  document.getElementById(
    "productImage"
  ).value = "";

  document.getElementById(
    "selectedFile"
  ).textContent =
    "Фото не выбрано";

}


document
  .getElementById("productImage")
  .addEventListener(
    "change",
    function() {

      const file =
        this.files[0];

      document
        .getElementById(
          "selectedFile"
        )
        .textContent =
          file
          ? "Выбрано: " + file.name
          : "Фото не выбрано";

    }
  );


/* =========================
   UPLOAD IMAGE
========================= */

async function uploadImage(file) {

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const fileName =
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2) +
    "." +
    extension;

  const response =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/" +
      BUCKET +
      "/" +
      fileName,
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + accessToken,
          "Content-Type":
            file.type
        },

        body: file
      }
    );

  const text =
    await response.text();

  if (!response.ok) {

    throw new Error(
      "Ошибка загрузки фото: " +
      text
    );

  }

  return (
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    BUCKET +
    "/" +
    fileName
  );

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct() {

  const name =
    document
      .getElementById("productName")
      .value.trim();

  const description =
    document
      .getElementById("productDescription")
      .value.trim();

  const price =
    document
      .getElementById("productPrice")
      .value;

  const category =
    document
      .getElementById("productCategory")
      .value.trim();

  const stock =
    document
      .getElementById("productStock")
      .value || 0;

  const file =
    document
      .getElementById("productImage")
      .files[0];


  if (!name) {

    showMessage(
      "productModalMessage",
      "Введите название"
    );

    return;

  }


  if (!price) {

    showMessage(
      "productModalMessage",
      "Введите цену"
    );

    return;

  }


  try {

    showMessage(
      "productModalMessage",
      "⏳ Сохраняем..."
    );


    let imageUrl = null;


    if (file) {

      imageUrl =
        await uploadImage(file);

    }


    const product = {

      name: name,

      description: description,

      price: Number(price),

      category: category,

      stock: Number(stock)

    };


    if (imageUrl) {

      product.image_url =
        imageUrl;

    }


    let response;


    if (editingProductId) {

      response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/products?id=eq." +
          editingProductId,
          {
            method: "PATCH",

            headers: {
              ...headers(),
              "Prefer":
                "return=representation"
            },

            body:
              JSON.stringify(product)
          }
        );

    } else {

      product.is_active = true;

      response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/products",
          {
            method: "POST",

            headers: {
              ...headers(),
              "Prefer":
                "return=representation"
            },

            body:
              JSON.stringify(product)
          }
        );

    }


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        JSON.stringify(data)
      );

    }


    closeProductModal();

    loadProducts();


  } catch (error) {

    showMessage(
      "productModalMessage",
      "❌ " + error.message
    );

  }

}


/* =========================
   EDIT PRODUCT
========================= */

async function editProduct(id) {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?id=eq." +
        id,
        {
          headers: headers()
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        JSON.stringify(data)
      );

    }

    const product =
      data[0];

    if (!product) return;


    editingProductId =
      product.id;


    document
      .getElementById(
        "productModalTitle"
      )
      .textContent =
        "Изменить товар";


    document.getElementById(
      "productName"
    ).value =
      product.name || "";


    document.getElementById(
      "productDescription"
    ).value =
      product.description || "";


    document.getElementById(
      "productPrice"
    ).value =
      product.price || "";


    document.getElementById(
      "productCategory"
    ).value =
      product.category || "";


    document.getElementById(
      "productStock"
    ).value =
      product.stock || 0;


    document.getElementById(
      "productImage"
    ).value = "";


    document.getElementById(
      "selectedFile"
    ).textContent =
      product.image_url
      ? "Текущее фото сохранится, если новое не выбрать"
      : "Фото не выбрано";


    document
      .getElementById(
        "productModal"
      )
      .classList.remove("hidden");


  } catch (error) {

    alert(
      "Ошибка: " +
      error.message
    );

  }

}


/* =========================
   TOGGLE
========================= */

async function toggleProduct(
  id,
  currentStatus
) {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?id=eq." +
        id,
        {
          method: "PATCH",

          headers: {
            ...headers(),
            "Prefer":
              "return=representation"
          },

          body: JSON.stringify({
            is_active:
              !currentStatus
          })
        }
      );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    loadProducts();

  } catch (error) {

    alert(
      "Ошибка: " +
      error.message
    );

  }

}


/* =========================
   DELETE
========================= */

async function deleteProduct(id) {

  if (
    !confirm(
      "Удалить товар?"
    )
  ) {

    return;

  }


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?id=eq." +
        id,
        {
          method: "DELETE",
          headers: headers()
        }
      );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    loadProducts();

  } catch (error) {

    alert(
      "Ошибка удаления: " +
      error.message
    );

  }

}


/* =========================
   ORDERS
========================= */

function setOrderFilter(filter) {

  currentOrderFilter =
    filter;


  document
    .getElementById(
      "ordersNewTab"
    )
    .classList.toggle(
      "active",
      filter === "new"
    );

  document
    .getElementById(
      "ordersDeliveryTab"
    )
    .classList.toggle(
      "active",
      filter === "delivery"
    );

  document
    .getElementById(
      "ordersDoneTab"
    )
    .classList.toggle(
      "active",
      filter === "done"
    );


  loadOrders();

}


async function loadOrders() {

  const table =
    document.getElementById(
      "ordersTable"
    );

  table.innerHTML =
    "<tr><td colspan='5'>Загрузка...</td></tr>";


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/orders?select=*&order=id.desc",
        {
          headers: headers()
        }
      );


    const orders =
      await response.json();


    if (!response.ok) {

      throw new Error(
        JSON.stringify(orders)
      );

    }


    const filtered =
      orders.filter(order => {

        if (
          currentOrderFilter === "new"
        ) {

          return [
            "new",
            "processing"
          ].includes(
            order.status
          );

        }

        if (
          currentOrderFilter === "delivery"
        ) {

          return order.status ===
            "delivery";

        }

        return [
          "completed",
          "cancelled"
        ].includes(
          order.status
        );

      });


    if (!filtered.length) {

      table.innerHTML =
        "<tr><td colspan='5'>Заказов пока нет.</td></tr>";

      return;

    }


    table.innerHTML =
      filtered.map(order => {

        const date =
          new Date(
            order.created_at
          ).toLocaleString(
            "ru-RU"
          );


        return `
          <tr
            class="order-row"
            onclick="openOrder(${order.id})"
          >

            <td>
              #${order.id}
            </td>

            <td>
              ${escapeHtml(
                order.customer_name
              )}
            </td>

            <td>
              <b>
                ${Number(
                  order.total
                ).toFixed(2)} €
              </b>
            </td>

            <td>
              ${date}
            </td>

            <td>
              ${statusName(
                order.status
              )}
            </td>

          </tr>
        `;

      }).join("");


  } catch (error) {

    table.innerHTML =
      `<tr>
        <td colspan="5">
          ❌ ${escapeHtml(
            error.message
          )}
        </td>
      </tr>`;

  }

}


/* =========================
   OPEN ORDER
========================= */

async function openOrder(id) {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/orders?id=eq." +
        id,
        {
          headers: headers()
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        JSON.stringify(data)
      );

    }


    const order =
      data[0];


    if (!order) return;


    document
      .getElementById(
        "orderDetails"
      )
      .innerHTML = `

        <p>
          <b>Заказ:</b> #${order.id}
        </p>

        <p>
          <b>Клиент:</b>
          ${escapeHtml(
            order.customer_name
          )}
        </p>

        <p>
          <b>Контакт:</b>
          ${escapeHtml(
            order.customer_contact || "—"
          )}
        </p>

        <p>
          <b>Город:</b>
          ${escapeHtml(
            order.city || "—"
          )}
        </p>

        <p>
          <b>Доставка:</b>
          ${escapeHtml(
            order.delivery_method || "—"
          )}
        </p>

        <p>
          <b>Комментарий:</b>
          ${escapeHtml(
            order.comment || "—"
          )}
        </p>

        <p class="total">
          Сумма:
          ${Number(
            order.total
          ).toFixed(2)} €
        </p>

        <hr>

        <label>
          Статус заказа
        </label>

        <select
          id="orderStatus"
        >

          <option
            value="new"
            ${order.status === "new"
              ? "selected"
              : ""}
          >
            🆕 Новый
          </option>

          <option
            value="processing"
            ${order.status === "processing"
              ? "selected"
              : ""}
          >
            ⚙️ Обработка
          </option>

          <option
            value="delivery"
            ${order.status === "delivery"
              ? "selected"
              : ""}
          >
            🚚 В доставке
          </option>

          <option
            value="completed"
            ${order.status === "completed"
              ? "selected"
              : ""}
          >
            ✅ Завершён
          </option>

          <option
            value="cancelled"
            ${order.status === "cancelled"
              ? "selected"
              : ""}
          >
            ❌ Отменён
          </option>

        </select>

        <button
          class="primary"
          onclick="updateOrderStatus(${order.id})"
        >
          Сохранить статус
        </button>

      `;


    document
      .getElementById(
        "orderModal"
      )
      .classList.remove(
        "hidden"
      );


  } catch (error) {

    alert(
      "Ошибка: " +
      error.message
    );

  }

}


function closeOrderModal() {

  document
    .getElementById(
      "orderModal"
    )
    .classList.add(
      "hidden"
    );

}


/* =========================
   UPDATE ORDER STATUS
========================= */

async function updateOrderStatus(id) {

  const status =
    document
      .getElementById(
        "orderStatus"
      )
      .value;


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/orders?id=eq." +
        id,
        {
          method: "PATCH",

          headers: {
            ...headers(),
            "Prefer":
              "return=representation"
          },

          body: JSON.stringify({
            status: status
          })
        }
      );


    if (!response.ok) {

      throw new Error(
        await response.text()
      );

    }


    closeOrderModal();

    loadOrders();

  } catch (error) {

    alert(
      "Ошибка изменения статуса: " +
      error.message
    );

  }

}


/* =========================
   HELPERS
========================= */

function statusName(status) {

  const names = {

    new:
      "🆕 Новый",

    processing:
      "⚙️ Обработка",

    delivery:
      "🚚 В доставке",

    completed:
      "✅ Завершён",

    cancelled:
      "❌ Отменён"

  };

  return names[status] ||
    status;

}


function showMessage(
  id,
  text
) {

  const element =
    document.getElementById(id);

  element.textContent =
    text;

  element.classList.remove(
    "hidden"
  );

}


function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}
