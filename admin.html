<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Miata Garage — Админка</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0d;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .card {
      background: #151519;
      border: 1px solid #29292f;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin: 7px 0 12px;
      border-radius: 10px;
      border: 1px solid #33343a;
      background: #0f0f12;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button.danger {
      background: #c62828;
      color: white;
    }

    button.secondary {
      background: #29292f;
      color: white;
    }

    .hidden {
      display: none;
    }

    .product {
      border-top: 1px solid #29292f;
      padding-top: 15px;
      margin-top: 15px;
    }

    .product img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .status {
      margin: 12px 0;
      padding: 12px;
      border-radius: 10px;
      background: #202025;
    }

    .file-name {
      color: #aaa;
      font-size: 14px;
      margin: 5px 0 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->

  <div id="loginBlock" class="card">

    <h1>🔐 Miata Garage</h1>

    <p>Вход администратора</p>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Пароль"
    >

    <button onclick="login()">
      Войти
    </button>

    <div id="loginStatus" class="status hidden"></div>

  </div>


  <!-- ADMIN -->

  <div id="adminBlock" class="hidden">

    <h1>🚗 Miata Garage</h1>

    <div class="card">

      <h2>Добавить товар</h2>

      <input
        id="productName"
        type="text"
        placeholder="Название товара"
      >

      <textarea
        id="productDescription"
        placeholder="Описание товара"
      ></textarea>

      <input
        id="productPrice"
        type="number"
        step="0.01"
        placeholder="Цена"
      >

      <input
        id="productCategory"
        type="text"
        placeholder="Категория"
      >

      <input
        id="productStock"
        type="number"
        placeholder="Количество"
        value="0"
      >

      <label>
        📷 Фотография товара
      </label>

      <input
        id="productImage"
        type="file"
        accept="image/*"
        onchange="showFileName()"
      >

      <div id="fileName" class="file-name">
        Фото не выбрано
      </div>

      <button onclick="addProduct()">
        ➕ Добавить товар
      </button>

      <div id="productStatus" class="status hidden"></div>

    </div>


    <div class="card">

      <h2>📦 Товары</h2>

      <div id="products">
        Загрузка...
      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   НАСТРОЙКИ SUPABASE
========================= */

const SUPABASE_URL =
  "https://qbuethosjrghgdwpanhb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_l-Jn1GONymTw-fuN1eEgBw_FjtbUyzg";


const BUCKET =
  "product-images";


let accessToken = "";


/* =========================
   ПОЛУЧИТЬ ЗАГОЛОВКИ
========================= */

function headers() {

  return {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + accessToken,
    "Content-Type": "application/json"
  };

}


/* =========================
   ПОКАЗАТЬ СТАТУС
========================= */

function showStatus(id, text) {

  const element =
    document.getElementById(id);

  element.textContent = text;

  element.classList.remove("hidden");

}


/* =========================
   ВХОД
========================= */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {

    showStatus(
      "loginStatus",
      "Введите email и пароль"
    );

    return;
  }


  try {

    const response = await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error_description ||
        data.msg ||
        data.message ||
        "Ошибка входа"
      );

    }


    accessToken =
      data.access_token;


    document
      .getElementById("loginBlock")
      .classList.add("hidden");


    document
      .getElementById("adminBlock")
      .classList.remove("hidden");


    loadProducts();

  } catch (error) {

    showStatus(
      "loginStatus",
      "Ошибка: " + error.message
    );

  }

}


/* =========================
   НАЗВАНИЕ ФАЙЛА
========================= */

function showFileName() {

  const file =
    document.getElementById(
      "productImage"
    ).files[0];


  const element =
    document.getElementById(
      "fileName"
    );


  if (file) {

    element.textContent =
      "Выбрано: " + file.name;

  } else {

    element.textContent =
      "Фото не выбрано";

  }

}


/* =========================
   ЗАГРУЗКА ФОТО
========================= */

async function uploadImage(file) {

  if (!file) {

    return "";

  }


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2) +
    "." +
    extension;


  const path =
    fileName;


  const response =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/" +
      BUCKET +
      "/" +
      path,
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + accessToken,
          "Content-Type":
            file.type,
          "x-upsert":
            "false"
        },

        body: file
      }
    );


  const data =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "Не удалось загрузить фото: " +
      data
    );

  }


  return (
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    BUCKET +
    "/" +
    path
  );

}


/* =========================
   ДОБАВИТЬ ТОВАР
========================= */

async function addProduct() {

  const name =
    document
      .getElementById("productName")
      .value
      .trim();


  const description =
    document
      .getElementById("productDescription")
      .value
      .trim();


  const price =
    document
      .getElementById("productPrice")
      .value;


  const category =
    document
      .getElementById("productCategory")
      .value
      .trim();


  const stock =
    document
      .getElementById("productStock")
      .value || 0;


  const file =
    document
      .getElementById("productImage")
      .files[0];


  if (!name) {

    showStatus(
      "productStatus",
      "Введите название товара"
    );

    return;

  }


  if (!price) {

    showStatus(
      "productStatus",
      "Введите цену"
    );

    return;

  }


  try {

    showStatus(
      "productStatus",
      "⏳ Сохраняем товар..."
    );


    let imageUrl = "";


    if (file) {

      imageUrl =
        await uploadImage(file);

    }


    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products",
        {
          method: "POST",

          headers: {
            ...headers(),
            "Prefer":
              "return=representation"
          },

          body: JSON.stringify({
            name: name,
            description: description,
            price: Number(price),
            category: category,
            stock: Number(stock),
            image_url: imageUrl,
            is_active: true
          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        data.error ||
        JSON.stringify(data)
      );

    }


    showStatus(
      "productStatus",
      "✅ Товар добавлен!"
    );


    document
      .getElementById("productName")
      .value = "";


    document
      .getElementById("productDescription")
      .value = "";


    document
      .getElementById("productPrice")
      .value = "";


    document
      .getElementById("productCategory")
      .value = "";


    document
      .getElementById("productStock")
      .value = "0";


    document
      .getElementById("productImage")
      .value = "";


    document
      .getElementById("fileName")
      .textContent =
        "Фото не выбрано";


    loadProducts();

  } catch (error) {

    showStatus(
      "productStatus",
      "❌ " + error.message
    );

  }

}


/* =========================
   ЗАГРУЗИТЬ ТОВАРЫ
========================= */

async function loadProducts() {

  const container =
    document.getElementById(
      "products"
    );


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?select=*&order=id.desc",
        {
          headers: headers()
        }
      );


    const products =
      await response.json();


    if (!response.ok) {

      throw new Error(
        JSON.stringify(products)
      );

    }


    if (!products.length) {

      container.innerHTML =
        "<p>Товаров пока нет.</p>";

      return;

    }


    container.innerHTML =
      products
        .map(product => {

          const image =
            product.image_url
              ? product.image_url
              : "";


          return `
            <div class="product">

              ${
                image
                ? `<img src="${image}" alt="">`
                : ""
              }

              <h3>
                ${escapeHtml(product.name)}
              </h3>

              <p>
                ${Number(product.price).toFixed(2)}
              </p>

              <p>
                Категория:
                ${escapeHtml(product.category || "—")}
              </p>

              <p>
                Остаток:
                ${product.stock}
              </p>

              <p>
                ${
                  product.is_active
                  ? "🟢 Активен"
                  : "🔴 Скрыт"
                }
              </p>

              <button
                class="secondary"
                onclick="toggleProduct(${product.id}, ${product.is_active})"
              >
                ${
                  product.is_active
                  ? "Скрыть товар"
                  : "Показать товар"
                }
              </button>

              <button
                class="danger"
                onclick="deleteProduct(${product.id})"
              >
                🗑 Удалить
              </button>

            </div>
          `;

        })
        .join("");


  } catch (error) {

    container.innerHTML =
      "<p>Ошибка: " +
      escapeHtml(error.message) +
      "</p>";

  }

}


/* =========================
   СКРЫТЬ / ПОКАЗАТЬ
========================= */

async function toggleProduct(
  id,
  currentStatus
) {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?id=eq." +
        id,
        {
          method: "PATCH",

          headers: {
            ...headers(),
            "Prefer":
              "return=representation"
          },

          body: JSON.stringify({
            is_active:
              !currentStatus
          })
        }
      );


    if (!response.ok) {

      const data =
        await response.json();

      throw new Error(
        JSON.stringify(data)
      );

    }


    loadProducts();

  } catch (error) {

    alert(
      "Ошибка: " +
      error.message
    );

  }

}


/* =========================
   УДАЛИТЬ
========================= */

async function deleteProduct(id) {

  if (
    !confirm(
      "Удалить этот товар?"
    )
  ) {

    return;

  }


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?id=eq." +
        id,
        {
          method: "DELETE",
          headers: headers()
        }
      );


    if (!response.ok) {

      const data =
        await response.json();

      throw new Error(
        JSON.stringify(data)
      );

    }


    loadProducts();

  } catch (error) {

    alert(
      "Ошибка удаления: " +
      error.message
    );

  }

}


/* =========================
   ЗАЩИТА HTML
========================= */

function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
