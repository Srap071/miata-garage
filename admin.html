<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Miata Garage — Admin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #09090b;
  color: #fff;
  font-family: Arial, sans-serif;
}

button,
input,
textarea,
select {
  font: inherit;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 16px;
}

h1 {
  margin: 0 0 18px;
}

h2 {
  margin-top: 0;
}

.card {
  background: #151518;
  border: 1px solid #29292e;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
}

.hidden {
  display: none !important;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  margin: 6px 0 12px;
  background: #0d0d10;
  color: white;
  border: 1px solid #34343b;
  border-radius: 10px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px 14px;
  cursor: pointer;
  font-weight: bold;
}

.primary {
  background: white;
  color: black;
}

.secondary {
  background: #29292f;
  color: white;
}

.danger {
  background: #b3261e;
  color: white;
}

.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin-bottom: 16px;
}

.tab {
  white-space: nowrap;
  background: #19191d;
  color: #aaa;
}

.tab.active {
  background: white;
  color: black;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1050px;
}

th,
td {
  padding: 11px 8px;
  border-bottom: 1px solid #29292e;
  text-align: left;
  vertical-align: middle;
}

th {
  color: #999;
  font-size: 13px;
}

.product-img {
  width: 55px;
  height: 55px;
  border-radius: 9px;
  object-fit: cover;
  background: #222;
}

.actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.status {
  display: inline-block;
  padding: 5px 8px;
  border-radius: 8px;
  background: #24242a;
  font-size: 13px;
  white-space: nowrap;
}

.top-badge {
  display: inline-block;
  padding: 5px 8px;
  border-radius: 8px;
  background: #302914;
  color: #ffd76a;
  font-size: 13px;
  white-space: nowrap;
}

.profit {
  color: #7cff9b;
  font-weight: bold;
}

.loss {
  color: #ff7777;
  font-weight: bold;
}

.old-price {
  color: #888;
  text-decoration: line-through;
}

.discount {
  color: #ff7777;
  font-weight: bold;
}

.total {
  font-size: 20px;
  font-weight: bold;
}

.message {
  padding: 10px;
  border-radius: 10px;
  background: #202025;
  margin-bottom: 12px;
}

.logout {
  float: right;
  margin-bottom: 15px;
}

.preview {
  width: 100%;
  max-height: 220px;
  object-fit: contain;
  border-radius: 12px;
  background: #0d0d10;
  margin-bottom: 12px;
}

.checkbox-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  margin: 8px 0 16px;
  background: #0d0d10;
  border: 1px solid #34343b;
  border-radius: 10px;
}

.checkbox-row input {
  width: 20px;
  height: 20px;
  margin: 0;
}

.checkbox-row label {
  cursor: pointer;
  margin: 0;
}

.order-products {
  margin: 12px 0;
}

.order-product {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #29292e;
}

.order-product:last-child {
  border-bottom: 0;
}

.order-product-img {
  width: 60px;
  height: 60px;
  border-radius: 9px;
  object-fit: cover;
  background: #222;
  flex-shrink: 0;
}

.order-product-info {
  flex: 1;
}

.order-product-name {
  font-weight: bold;
  margin-bottom: 4px;
}

.order-product-meta {
  color: #aaa;
  font-size: 13px;
}

.order-summary {
  background: #0d0d10;
  border-radius: 12px;
  padding: 12px;
  margin-top: 15px;
}

.order-line {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin: 7px 0;
}

.order-line.total-line {
  border-top: 1px solid #34343b;
  padding-top: 10px;
  margin-top: 10px;
  font-size: 18px;
  font-weight: bold;
}

.info-line {
  margin: 9px 0;
}

.info-label {
  color: #999;
  font-size: 13px;
  margin-bottom: 3px;
}

@media (max-width: 600px) {
  .container {
    padding: 10px;
  }

  .toolbar {
    align-items: stretch;
    flex-direction: column;
  }

  .logout {
    float: none;
    width: 100%;
    margin-bottom: 15px;
  }

  .modal-box {
    padding: 14px;
  }
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 10;
}

.modal-box {
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  background: #151518;
  border: 1px solid #303038;
  border-radius: 18px;
  padding: 18px;
}

.close {
  float: right;
  background: #29292f;
  color: white;
}

.order-row {
  cursor: pointer;
}

.order-row:hover {
  background: #1c1c21;
}
</style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->

  <div id="loginScreen" class="card">

    <h1>🚗 Miata Garage</h1>

    <p>Панель администратора</p>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Пароль"
    >

    <button class="primary" onclick="login()">
      Войти
    </button>

    <div id="loginMessage" class="message hidden"></div>

  </div>


  <!-- ADMIN -->

  <div id="adminScreen" class="hidden">

    <button
      class="secondary logout"
      onclick="logout()"
    >
      Выйти
    </button>

    <h1>Miata Garage</h1>

    <!-- MAIN TABS -->

    <div class="tabs">

      <button
        id="productsTab"
        class="tab active"
        onclick="showTab('products')"
      >
        📦 Товары
      </button>

      <button
        id="ordersTab"
        class="tab"
        onclick="showTab('orders')"
      >
        🛒 Заказы
      </button>

    </div>


    <!-- PRODUCTS -->

    <section id="productsSection">

      <div class="toolbar">

        <h2>Товары</h2>

        <button
          class="primary"
          onclick="openProductModal()"
        >
          ＋ Добавить
        </button>

      </div>

      <div
        id="productsMessage"
        class="message hidden"
      ></div>

      <div class="card">

        <div class="table-wrap">

          <table>

            <thead>

              <tr>
                <th>Фото</th>
                <th>Название</th>
                <th>Цена</th>
                <th>Старая цена</th>
                <th>Скидка</th>
                <th>Закупка</th>
                <th>Прибыль</th>
                <th>Категория</th>
                <th>Остаток</th>
                <th>Статус</th>
                <th>Топ продаж</th>
                <th>Действия</th>
              </tr>

            </thead>

            <tbody id="productsTable"></tbody>

          </table>

        </div>

      </div>

    </section>


    <!-- ORDERS -->

    <section
      id="ordersSection"
      class="hidden"
    >

      <div class="toolbar">

        <h2>Заказы</h2>

        <button
          class="secondary"
          onclick="loadOrders()"
        >
          🔄 Обновить
        </button>

      </div>


      <div class="tabs">

        <button
          class="tab active"
          id="ordersNewTab"
          onclick="setOrderFilter('new')"
        >
          🕐 В обработке
        </button>

        <button
          class="tab"
          id="ordersDeliveryTab"
          onclick="setOrderFilter('delivery')"
        >
          🚚 В доставке
        </button>

        <button
          class="tab"
          id="ordersDoneTab"
          onclick="setOrderFilter('done')"
        >
          ✅ Прошедшие
        </button>

      </div>


      <div class="card">

        <div class="table-wrap">

          <table>

            <thead>

              <tr>
                <th>№</th>
                <th>Дата</th>
                <th>Время</th>
                <th>Клиент</th>
                <th>Контакт</th>
                <th>Сумма</th>
                <th>Оплата</th>
                <th>Статус</th>
              </tr>

            </thead>

            <tbody id="ordersTable"></tbody>

          </table>

        </div>

      </div>

    </section>

  </div>

</div>


<!-- PRODUCT MODAL -->

<div
  id="productModal"
  class="modal hidden"
>

  <div class="modal-box">

    <button
      class="close"
      onclick="closeProductModal()"
    >
      ✕
    </button>

    <h2 id="productModalTitle">
      Добавить товар
    </h2>


    <label>
      Название
    </label>

    <input
      id="productName"
      placeholder="Например: Mazda RX-7"
    >


    <label>
      Описание
    </label>

    <textarea
      id="productDescription"
      placeholder="Описание модели"
    ></textarea>


    <label>
      Цена продажи, ₽
    </label>

    <input
      id="productPrice"
      type="number"
      step="1"
      placeholder="Например: 5000"
    >


    <label>
      Старая цена, ₽
    </label>

    <input
      id="productOldPrice"
      type="number"
      step="1"
      placeholder="Например: 6000"
    >


    <label>
      Скидка, %
    </label>

    <input
      id="productDiscount"
      type="number"
      step="1"
      min="0"
      max="100"
      placeholder="Например: 15"
    >


    <label>
      Закупочная цена, ₽
    </label>

    <input
      id="productCost"
      type="number"
      step="1"
      placeholder="Например: 3000"
    >


    <div
      id="profitPreview"
      class="profit"
    >
      Прибыль: 0 ₽
    </div>

    <br>


    <label>
      Категория
    </label>

    <input
      id="productCategory"
      placeholder="Например: Mazda"
    >


    <label>
      Остаток
    </label>

    <input
      id="productStock"
      type="number"
      min="0"
      placeholder="Остаток"
      value="0"
    >


    <div class="checkbox-row">

      <input
        id="productIsTop"
        type="checkbox"
      >

      <label for="productIsTop">
        ⭐ Показывать в «Топ продаж»
      </label>

    </div>


    <label>
      📷 Фотография с телефона
    </label>

    <input
      id="productImage"
      type="file"
      accept="image/*"
    >


    <p id="selectedFile">
      Фото не выбрано
    </p>


    <img
      id="imagePreview"
      class="preview hidden"
    >


    <button
      class="primary"
      onclick="saveProduct()"
    >
      💾 Сохранить
    </button>


    <div
      id="productModalMessage"
      class="message hidden"
    ></div>

  </div>

</div>


<!-- ORDER MODAL -->

<div
  id="orderModal"
  class="modal hidden"
>

  <div class="modal-box">

    <button
      class="close"
      onclick="closeOrderModal()"
    >
      ✕
    </button>

    <h2>🛒 Заказ</h2>

    <div id="orderDetails"></div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://qbuethosjrghgdwpanhb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_l-Jn1GONymTw-fuN1eEgBw_FjtbUyzg";

const BUCKET =
  "product-images";


let accessToken =
  localStorage.getItem("miata_access_token") || "";

let refreshToken =
  localStorage.getItem("miata_refresh_token") || "";

let editingProductId = null;

let currentOrderFilter = "new";


/* =========================
   HEADERS
========================= */

function headers() {

  return {
    "apikey": SUPABASE_KEY,
    "Authorization":
      "Bearer " + accessToken,
    "Content-Type":
      "application/json"
  };

}


/* =========================
   SAVE SESSION
========================= */

function saveSession(data) {

  accessToken =
    data.access_token || "";

  refreshToken =
    data.refresh_token || "";

  if (accessToken) {

    localStorage.setItem(
      "miata_access_token",
      accessToken
    );

  }

  if (refreshToken) {

    localStorage.setItem(
      "miata_refresh_token",
      refreshToken
    );

  }

}


/* =========================
   REFRESH SESSION
========================= */

async function refreshSession() {

  if (!refreshToken) {
    return false;
  }

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=refresh_token",
        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            refresh_token:
              refreshToken
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      localStorage.removeItem(
        "miata_access_token"
      );

      localStorage.removeItem(
        "miata_refresh_token"
      );

      accessToken = "";
      refreshToken = "";

      return false;
    }

    saveSession(data);

    return true;

  } catch (error) {

    return false;

  }

}


/* =========================
   CHECK SESSION
========================= */

async function checkSession() {

  if (!accessToken) {
    return false;
  }

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/user",
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + accessToken
          }
        }
      );

    if (response.ok) {
      return true;
    }

    return await refreshSession();

  } catch (error) {

    return false;

  }

}


/* =========================
   SHOW ADMIN
========================= */

async function showAdmin() {

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("adminScreen")
    .classList.remove("hidden");

  await loadProducts();

}


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  if (!email || !password) {

    showMessage(
      "loginMessage",
      "Введите email и пароль"
    );

    return;

  }

  try {

    showMessage(
      "loginMessage",
      "⏳ Входим..."
    );

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error_description ||
        data.message ||
        "Ошибка входа"
      );

    }

    saveSession(data);

    await showAdmin();

  } catch (error) {

    showMessage(
      "loginMessage",
      "❌ " + error.message
    );

  }

}


/* =========================
   LOGOUT
========================= */

function logout() {

  localStorage.removeItem(
    "miata_access_token"
  );

  localStorage.removeItem(
    "miata_refresh_token"
  );

  accessToken = "";
  refreshToken = "";

  document
    .getElementById("adminScreen")
    .classList.add("hidden");

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

}


/* =========================
   TABS
========================= */

function showTab(tab) {

  document
    .getElementById("productsSection")
    .classList.toggle(
      "hidden",
      tab !== "products"
    );

  document
    .getElementById("ordersSection")
    .classList.toggle(
      "hidden",
      tab !== "orders"
    );

  document
    .getElementById("productsTab")
    .classList.toggle(
      "active",
      tab === "products"
    );

  document
    .getElementById("ordersTab")
    .classList.toggle(
      "active",
      tab === "orders"
    );

  if (tab === "orders") {

    loadOrders();

  }

}


/* =========================
   PRODUCTS
========================= */

async function loadProducts() {

  const table =
    document.getElementById(
      "productsTable"
    );

  table.innerHTML =
    "<tr><td colspan='12'>Загрузка...</td></tr>";

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?select=*&order=id.desc",
        {
          headers: headers()
        }
      );

    const products =
      await response.json();

    if (!response.ok) {

      throw new Error(
        JSON.stringify(products)
      );

    }

    if (!products.length) {

      table.innerHTML =
        "<tr><td colspan='12'>Товаров пока нет.</td></tr>";

      return;

    }


    table.innerHTML =
      products.map(product => {

        const image =
          product.image_url || "";

        const price =
          Number(product.price || 0);

        const oldPrice =
          Number(product.old_price || 0);

        const discount =
          Number(product.discount || 0);

        const cost =
          Number(product.cost_price || 0);

        const profit =
          price - cost;

        const profitClass =
          profit >= 0
          ? "profit"
          : "loss";


        return `

          <tr>

            <td>
              ${
                image
                ? `<img
                    class="product-img"
                    src="${escapeHtml(image)}"
                    alt=""
                  >`
                : "—"
              }
            </td>


            <td>
              <b>
                ${escapeHtml(product.name || "Без названия")}
              </b>
            </td>


            <td>
              <b>
                ${formatMoney(price)}
              </b>
            </td>


            <td>
              ${
                oldPrice > 0
                ? `<span class="old-price">
                    ${formatMoney(oldPrice)}
                  </span>`
                : "—"
              }
            </td>


            <td>
              ${
                discount > 0
                ? `<span class="discount">
                    −${discount}%
                  </span>`
                : "—"
              }
            </td>


            <td>
              ${formatMoney(cost)}
            </td>


            <td class="${profitClass}">
              ${formatMoney(profit)}
            </td>


            <td>
              ${escapeHtml(
                product.category || "—"
              )}
            </td>


            <td>
              ${Number(product.stock || 0)}
            </td>


            <td>
              <span class="status">
                ${
                  product.is_active
                  ? "🟢 Активен"
                  : "🔴 Скрыт"
                }
              </span>
            </td>


            <td>
              ${
                product.is_top
                ? `<span class="top-badge">
                    ⭐ Топ
                  </span>`
                : "—"
              }
            </td>


            <td>

              <div class="actions">

                <button
                  class="secondary"
                  onclick="editProduct(${product.id})"
                >
                  ✏️
                </button>


                <button
                  class="secondary"
                  onclick="toggleProduct(
                    ${product.id},
                    ${Boolean(product.is_active)}
                  )"
                >
                  ${
                    product.is_active
                    ? "Скрыть"
                    : "Показать"
                  }
                </button>


                <button
                  class="danger"
                  onclick="deleteProduct(${product.id})"
                >
                  🗑
                </button>

              </div>

            </td>

          </tr>

        `;

      }).join("");


  } catch (error) {

    table.innerHTML =
      `<tr>
        <td colspan="12">
          ❌ ${escapeHtml(error.message)}
        </td>
      </tr>`;

  }

}


/* =========================
   PRODUCT MODAL
========================= */

function openProductModal() {

  editingProductId = null;

  document
    .getElementById("productModalTitle")
    .textContent =
      "Добавить товар";

  clearProductForm();

  document
    .getElementById("productModal")
    .classList.remove("hidden");

}


function closeProductModal() {

  document
    .getElementById("productModal")
    .classList.add("hidden");

}


function clearProductForm() {

  document.getElementById(
    "productName"
  ).value = "";

  document.getElementById(
    "productDescription"
  ).value = "";

  document.getElementById(
    "productPrice"
  ).value = "";

  document.getElementById(
    "productOldPrice"
  ).value = "";

  document.getElementById(
    "productDiscount"
  ).value = "";

  document.getElementById(
    "productCost"
  ).value = "";

  document.getElementById(
    "productCategory"
  ).value = "";

  document.getElementById(
    "productStock"
  ).value = "0";

  document.getElementById(
    "productIsTop"
  ).checked = false;

  document.getElementById(
    "productImage"
  ).value = "";

  document.getElementById(
    "selectedFile"
  ).textContent =
    "Фото не выбрано";

  document.getElementById(
    "imagePreview"
  ).classList.add("hidden");

  document.getElementById(
    "imagePreview"
  ).src = "";

  document.getElementById(
    "profitPreview"
  ).textContent =
    "Прибыль: 0 ₽";

  document.getElementById(
    "productModalMessage"
  ).classList.add("hidden");

}


/* =========================
   IMAGE PREVIEW
========================= */

document
  .getElementById("productImage")
  .addEventListener(
    "change",
    function() {

      const file =
        this.files[0];

      document
        .getElementById(
          "selectedFile"
        )
        .textContent =
          file
          ? "Выбрано: " + file.name
          : "Фото не выбрано";

      if (file) {

        const url =
          URL.createObjectURL(file);

        const preview =
          document.getElementById(
            "imagePreview"
          );

        preview.src = url;

        preview.classList.remove(
          "hidden"
        );

      }

    }
  );


/* =========================
   PROFIT
========================= */

document
  .getElementById("productPrice")
  .addEventListener(
    "input",
    updateProfitPreview
  );


document
  .getElementById("productCost")
  .addEventListener(
    "input",
    updateProfitPreview
  );


function updateProfitPreview() {

  const price =
    Number(
      document.getElementById(
        "productPrice"
      ).value || 0
    );

  const cost =
    Number(
      document.getElementById(
        "productCost"
      ).value || 0
    );

  const profit =
    price - cost;


  const element =
    document.getElementById(
      "profitPreview"
    );

  element.textContent =
    "Прибыль: " +
    formatMoney(profit);

  element.className =
    profit >= 0
    ? "profit"
    : "loss";

}


/* =========================
   UPLOAD IMAGE
========================= */

async function uploadImage(file) {

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const fileName =
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2) +
    "." +
    extension;


  const response =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/" +
      BUCKET +
      "/" +
      fileName,
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + accessToken,
          "Content-Type":
            file.type
        },

        body: file
      }
    );


  const text =
    await response.text();


  if (!response.ok) {

    throw new Error(
      "Ошибка загрузки фото: " +
      text
    );

  }


  return (
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    BUCKET +
    "/" +
    fileName
  );

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct() {

  const name =
    document
      .getElementById("productName")
      .value
      .trim();

  const description =
    document
      .getElementById("productDescription")
      .value
      .trim();

  const price =
    document
      .getElementById("productPrice")
      .value;

  const oldPrice =
    document
      .getElementById("productOldPrice")
      .value || 0;

  const discount =
    document
      .getElementById("productDiscount")
      .value || 0;

  const costPrice =
    document
      .getElementById("productCost")
      .value || 0;

  const category =
    document
      .getElementById("productCategory")
      .value
      .trim();

  const stock =
    document
      .getElementById("productStock")
      .value || 0;

  const isTop =
    document
      .getElementById("productIsTop")
      .checked;

  const file =
    document
      .getElementById("productImage")
      .files[0];


  if (!name) {

    showMessage(
      "productModalMessage",
      "Введите название"
    );

    return;

  }


  if (!price) {

    showMessage(
      "productModalMessage",
      "Введите цену продажи"
    );

    return;

  }


  try {

    showMessage(
      "productModalMessage",
      "⏳ Сохраняем..."
    );


    let imageUrl = null;


    if (file) {

      imageUrl =
        await uploadImage(file);

    }


    const product = {

      name: name,

      description: description,

      price: Number(price),

      old_price:
        Number(oldPrice),

      discount:
        Number(discount),

      cost_price:
        Number(costPrice),

      category: category,

      stock:
        Number(stock),

      is_top:
        isTop

    };


    if (imageUrl) {

      product.image_url =
        imageUrl;

    }


    let response;


    if (editingProductId) {

      response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/products?id=eq." +
          editingProductId,
          {
            method: "PATCH",

            headers: {
              ...headers(),
              "Prefer":
                "return=representation"
            },

            body:
              JSON.stringify(product)
          }
        );

    } else {

      product.is_active = true;

      response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/products",
          {
            method: "POST",

            headers: {
              ...headers(),
              "Prefer":
                "return=representation"
            },

            body:
              JSON.stringify(product)
          }
        );

    }


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        JSON.stringify(data)
      );

    }


    closeProductModal();

    await loadProducts();


  } catch (error) {

    showMessage(
      "productModalMessage",
      "❌ " + error.message
    );

  }

}


/* =========================
   EDIT PRODUCT
========================= */

async function editProduct(id) {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?id=eq." +
        id,
        {
          headers: headers()
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        JSON.stringify(data)
      );

    }


    const product =
      data[0];


    if (!product) return;


    editingProductId =
      product.id;


    document
      .getElementById(
        "productModalTitle"
      )
      .textContent =
        "Изменить товар";


    document.getElementById(
      "productName"
    ).value =
      product.name || "";


    document.getElementById(
      "productDescription"
    ).value =
      product.description || "";


    document.getElementById(
      "productPrice"
    ).value =
      product.price || "";


    document.getElementById(
      "productOldPrice"
    ).value =
      product.old_price || "";


    document.getElementById(
      "productDiscount"
    ).value =
      product.discount || "";


    document.getElementById(
      "productCost"
    ).value =
      product.cost_price || "";


    document.getElementById(
      "productCategory"
    ).value =
      product.category || "";


    document.getElementById(
      "productStock"
    ).value =
      product.stock || 0;


    document.getElementById(
      "productIsTop"
    ).checked =
      Boolean(product.is_top);


    document.getElementById(
      "productImage"
    ).value = "";


    document.getElementById(
      "selectedFile"
    ).textContent =
      product.image_url
      ? "Текущее фото сохранится, если новое не выбрать"
      : "Фото не выбрано";


    const preview =
      document.getElementById(
        "imagePreview"
      );


    if (product.image_url) {

      preview.src =
        product.image_url;

      preview.classList.remove(
        "hidden"
      );

    } else {

      preview.src = "";

      preview.classList.add(
        "hidden"
      );

    }


    updateProfitPreview();


    document
      .getElementById(
        "productModal"
      )
      .classList.remove("hidden");


  } catch (error) {

    alert(
      "Ошибка: " +
      error.message
    );

  }

}

/* =========================
   ORDERS
========================= */

function setOrderFilter(filter) {

  currentOrderFilter =
    filter;


  document
    .getElementById(
      "ordersNewTab"
    )
    .classList.toggle(
      "active",
      filter === "new"
    );


  document
    .getElementById(
      "ordersDeliveryTab"
    )
    .classList.toggle(
      "active",
      filter === "delivery"
    );


  document
    .getElementById(
      "ordersDoneTab"
    )
    .classList.toggle(
      "active",
      filter === "done"
    );


  loadOrders();

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders() {

  const table =
    document.getElementById(
      "ordersTable"
    );


  table.innerHTML =
    "<tr><td colspan='8'>Загрузка...</td></tr>";


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/orders?select=*&order=id.desc",
        {
          headers: headers()
        }
      );


    const orders =
      await response.json();


    if (!response.ok) {

      throw new Error(
        JSON.stringify(orders)
      );

    }


    const filtered =
      orders.filter(order => {

        if (
          currentOrderFilter === "new"
        ) {

          return [
            "processing",
            "new"
          ].includes(
            order.order_status
          );

        }


        if (
          currentOrderFilter === "delivery"
        ) {

          return (
            order.order_status ===
            "delivery"
          );

        }


        return [
          "completed",
          "cancelled"
        ].includes(
          order.order_status
        );

      });


    if (!filtered.length) {

      table.innerHTML =
        "<tr><td colspan='8'>Заказов пока нет.</td></tr>";

      return;

    }


    table.innerHTML =
      filtered.map(order => {

        const dateObject =
          new Date(
            order.created_at
          );


        const date =
          dateObject.toLocaleDateString(
            "ru-RU"
          );


        const time =
          dateObject.toLocaleTimeString(
            "ru-RU",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );


        return `

          <tr
            class="order-row"
            onclick="openOrder(${order.id})"
          >

            <td>
              <b>
                #${escapeHtml(
                  order.Order_number ??
                  order.order_number ??
                  order.id
                )}
              </b>
            </td>


            <td>
              ${date}
            </td>


            <td>
              ${time}
            </td>


            <td>
              ${escapeHtml(
                order.customer_name ||
                "—"
              )}
            </td>


            <td>
              ${escapeHtml(
                order.customer_contact ||
                "—"
              )}
            </td>


            <td>
              <b>
                ${formatMoney(
                  order.total
                )}
              </b>
            </td>


            <td>
              ${paymentStatusName(
                order.payment_status
              )}
            </td>


            <td>
              ${statusName(
                order.order_status
              )}
            </td>

          </tr>

        `;

      }).join("");


  } catch (error) {

    table.innerHTML =
      `<tr>
        <td colspan="8">
          ❌ ${escapeHtml(
            error.message
          )}
        </td>
      </tr>`;

  }

}


/* =========================
   OPEN ORDER
========================= */

async function openOrder(id) {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/orders?id=eq." +
        id,
        {
          headers: headers()
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        JSON.stringify(data)
      );

    }


    const order =
      data[0];


    if (!order) return;


    const orderNumber =
      order.Order_number ??
      order.order_number ??
      order.id;


    const dateObject =
      new Date(
        order.created_at
      );


    const date =
      dateObject.toLocaleDateString(
        "ru-RU"
      );


    const time =
      dateObject.toLocaleTimeString(
        "ru-RU",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );


    let items = [];

    try {

      if (Array.isArray(order.items)) {

        items =
          order.items;

      } else if (
        typeof order.items === "string"
      ) {

        items =
          JSON.parse(
            order.items
          );

      }

    } catch (error) {

      items = [];

    }


    let productsHtml =
      "<p>Товары не указаны.</p>";


    if (items.length) {

      productsHtml =
        items.map(item => {

          const itemImage =
            item.image_url ||
            item.image ||
            "";

          const itemName =
            item.name ||
            "Товар";

          const quantity =
            Number(
              item.quantity || 1
            );

          const price =
            Number(
              item.price || 0
            );


          return `

            <div class="order-product">

              ${
                itemImage
                ? `<img
                    class="order-product-img"
                    src="${escapeHtml(itemImage)}"
                    alt=""
                  >`
                : `<div
                    class="order-product-img"
                  ></div>`
              }


              <div class="order-product-info">

                <div class="order-product-name">
                  ${escapeHtml(itemName)}
                </div>

                <div class="order-product-meta">
                  ${quantity} шт. ×
                  ${formatMoney(price)}
                </div>

              </div>


              <b>
                ${formatMoney(
                  price * quantity
                )}
              </b>

            </div>

          `;

        }).join("");

    }


    document
      .getElementById(
        "orderDetails"
      )
      .innerHTML = `

        <div class="info-line">

          <div class="info-label">
            Номер заказа
          </div>

          <b>
            #${escapeHtml(orderNumber)}
          </b>

        </div>


        <div class="info-line">

          <div class="info-label">
            Дата и время
          </div>

          ${date} в ${time}

        </div>


        <div class="info-line">

          <div class="info-label">
            Клиент
          </div>

          ${escapeHtml(
            order.customer_name ||
            "—"
          )}

        </div>


        <div class="info-line">

          <div class="info-label">
            Контакт
          </div>

          ${escapeHtml(
            order.customer_contact ||
            "—"
          )}

        </div>


        <div class="info-line">

          <div class="info-label">
            Город
          </div>

          ${escapeHtml(
            order.city ||
            "—"
          )}

        </div>


        <div class="info-line">

          <div class="info-label">
            Способ доставки
          </div>

          ${escapeHtml(
            order.delivery_method ||
            "—"
          )}

        </div>


        <div class="info-line">

          <div class="info-label">
            Комментарий
          </div>

          ${escapeHtml(
            order.comment ||
            "—"
          )}

        </div>


        <hr>


        <h3>
          📦 Товары
        </h3>


        <div class="order-products">

          ${productsHtml}

        </div>


        <div class="order-summary">

          <div class="order-line">

            <span>
              Доставка
            </span>

            <span>
              ${formatMoney(
                order.delivery_cost
              )}
            </span>

          </div>


          <div class="order-line total-line">

            <span>
              Итого
            </span>

            <span>
              ${formatMoney(
                order.total
              )}
            </span>

          </div>

        </div>


        <hr>


        <label>
          Статус оплаты
        </label>


        <select id="orderPaymentStatus">

          <option
            value="unpaid"
            ${
              order.payment_status ===
              "unpaid"
              ? "selected"
              : ""
            }
          >
            💳 Не оплачено
          </option>


          <option
            value="paid"
            ${
              order.payment_status ===
              "paid"
              ? "selected"
              : ""
            }
          >
            💳 Оплачено
          </option>

        </select>


        <label>
          Статус заказа
        </label>


        <select id="orderStatus">

          <option
            value="processing"
            ${
              order.order_status ===
              "processing"
              ? "selected"
              : ""
            }
          >
            🕐 В обработке
          </option>


          <option
            value="delivery"
            ${
              order.order_status ===
              "delivery"
              ? "selected"
              : ""
            }
          >
            🚚 В доставке
          </option>


          <option
            value="completed"
            ${
              order.order_status ===
              "completed"
              ? "selected"
              : ""
            }
          >
            ✅ Получено
          </option>


          <option
            value="cancelled"
            ${
              order.order_status ===
              "cancelled"
              ? "selected"
              : ""
            }
          >
            ❌ Отменено
          </option>

        </select>


        <button
          class="primary"
          onclick="updateOrder(${order.id})"
        >
          💾 Сохранить изменения
        </button>

      `;


    document
      .getElementById(
        "orderModal"
      )
      .classList.remove(
        "hidden"
      );


  } catch (error) {

    alert(
      "Ошибка: " +
      error.message
    );

  }

}


/* =========================
   CLOSE ORDER
========================= */

function closeOrderModal() {

  document
    .getElementById(
      "orderModal"
    )
    .classList.add(
      "hidden"
    );

}


/* =========================
   UPDATE ORDER
========================= */

async function updateOrder(id) {

  const orderStatus =
    document
      .getElementById(
        "orderStatus"
      )
      .value;


  const paymentStatus =
    document
      .getElementById(
        "orderPaymentStatus"
      )
      .value;


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/orders?id=eq." +
        id,
        {
          method: "PATCH",

          headers: {
            ...headers(),
            "Prefer":
              "return=representation"
          },

          body: JSON.stringify({

            order_status:
              orderStatus,

            payment_status:
              paymentStatus

          })
        }
      );


    const text =
      await response.text();


    if (!response.ok) {

      throw new Error(
        text
      );

    }


    closeOrderModal();

    await loadOrders();


  } catch (error) {

    alert(
      "Ошибка изменения заказа: " +
      error.message
    );

  }

}


/* =========================
   HELPERS
========================= */

function formatMoney(value) {

  return Number(value || 0)
    .toLocaleString(
      "ru-RU",
      {
        maximumFractionDigits: 0
      }
    ) + " ₽";

}


function statusName(status) {

  const names = {

    new:
      "🕐 В обработке",

    processing:
      "🕐 В обработке",

    delivery:
      "🚚 В доставке",

    completed:
      "✅ Получено",

    cancelled:
      "❌ Отменено"

  };


  return names[status] ||
    "🕐 В обработке";

}


function paymentStatusName(status) {

  const names = {

    unpaid:
      "💳 Не оплачено",

    paid:
      "💳 Оплачено"

  };


  return names[status] ||
    "💳 Не оплачено";

}


function showMessage(
  id,
  text
) {

  const element =
    document.getElementById(id);


  element.textContent =
    text;


  element.classList.remove(
    "hidden"
  );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}
